name: migrate documentary registry exact once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-documentary-registry-exact.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Materialize exact release bytes
        shell: python
        env:
          DATA_B64: 
        run: |
          import base64, gzip, hashlib, os
          from pathlib import Path
          expected = 'a4103fa943d6a5770d441c8b6db82b79fd98020de4d185d0cc8b725cf58d92cf'
          data = gzip.decompress(base64.b64decode(os.environ['DATA_B64']))
          actual = hashlib.sha256(data).hexdigest()
          assert actual == expected, (actual, expected)
          target = Path('dispositivo/runtime/v0_2_15_3/DOCUMENTARY_ALIGNMENT_REGISTRY_v0_2_15_2.csv')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)
      - name: Commit exact registry
        shell: bash
        run: |
          git config user.name 'migration-agent'
          git config user.email 'migration-agent@users.noreply.github.com'
          git add dispositivo/runtime/v0_2_15_3/DOCUMENTARY_ALIGNMENT_REGISTRY_v0_2_15_2.csv
          git diff --cached --quiet && exit 0
          git commit -m 'migrate exact documentary alignment registry v0.2.15.2'
          git push
