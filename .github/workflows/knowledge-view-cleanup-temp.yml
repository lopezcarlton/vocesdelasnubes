name: knowledge-view-cleanup-temp

on:
  push:
    paths:
      - '.github/workflows/knowledge-view-cleanup-temp.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Clean canonical views and backlog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p=Path(path); t=p.read_text(encoding='utf-8')
              n=t.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected 1 match, got {n}: {old[:120]!r}')
              p.write_text(t.replace(old,new,1),encoding='utf-8')

          # PEDAGOGIA: preserve substance, remove deference to implementation.
          reps=[
          ('conocimiento/PEDAGOGIA.md','la forma en que deberían utilizarse en una futura secuenciación o generación automatizada.','la forma en que deberían utilizarse en una futura secuenciación o aplicación operativa.'),
          ('conocimiento/PEDAGOGIA.md','Para evitar una ambigüedad que produjo problemas en versiones anteriores del generador, se distinguen tres afirmaciones diferentes:','Para evitar una ambigüedad detectada durante aplicaciones operativas anteriores, se distinguen tres afirmaciones diferentes:'),
          ('conocimiento/PEDAGOGIA.md','resultados de la corrección ortográfica y análisis lingüístico en curso, pruebas del dispositivo y futura validación con aprendices.','resultados de la corrección ortográfica y análisis lingüístico en curso, hallazgos adjudicados procedentes de líneas técnicas y futura validación con aprendices.'),
          ('conocimiento/PEDAGOGIA.md','Por ahora deben tratarse primero como capas analíticas descriptivas que el dispositivo pueda reconocer y conservar. Posteriormente, escenas reales, corpus oral y pruebas con aprendices deberán mostrar:','Por ahora deben tratarse primero como capas analíticas descriptivas del conocimiento lingüístico. Posteriormente, escenas reales, corpus oral y pruebas con aprendices deberán mostrar:'),
          ('conocimiento/PEDAGOGIA.md','- cuáles son útiles para Analyzer/Tutor pero no necesitan una escala curricular;','- cuáles son útiles para análisis y explicación pero no necesitan una escala curricular;'),
          ('conocimiento/PEDAGOGIA.md','La capacidad lingüística del dispositivo puede ser más fina que la taxonomía pedagógica vigente. Descubrir o modelar una distinción no obliga a convertirla inmediatamente en requisito de enseñanza.','La descripción lingüística puede ser más fina que la taxonomía pedagógica vigente. Descubrir o modelar una distinción no obliga a convertirla inmediatamente en requisito de enseñanza.'),
          ('conocimiento/PEDAGOGIA.md','8. aprender de la realización en Didxazá antes de volver a escalar la automatización.','8. aprender de la realización en Didxazá antes de escalar la producción de materiales.'),
          ('conocimiento/PEDAGOGIA.md','El generador masivo permanece fuera del flujo activo mientras no existan escenas de referencia aprobadas suficientes para calibrarlo.','La producción masiva de borradores permanece fuera del flujo activo mientras no existan escenas de referencia aprobadas suficientes para calibrar sus requisitos.'),
          ('conocimiento/PEDAGOGIA.md','Las distinciones finas de estructura informativa, referencia, discurso y prosodia derivadas de BIB065 se implementarán primero como capas analíticas descriptivas y no se asignan automáticamente a G, P ni a un tercer eje pedagógico.','Las distinciones finas de estructura informativa, referencia, discurso y prosodia derivadas de BIB065 se conservarán primero como capas analíticas descriptivas y no se asignan automáticamente a G, P ni a un tercer eje pedagógico.'),
          ]
          for x in reps: rep(*x)

          # CORPUS: current view remains implementation-neutral; history can live in source/technical genealogy.
          rep('conocimiento/CORPUS.md',
              'Las versiones v7 y v8.x del generador se conservan como antecedentes experimentales. Permitieron descubrir problemas reales —longitud rígida, activación sin CORE, exceso de trama, ritmo de entrevista, artificialidad por repetición y regresiones entre reglas—, pero ninguna se considera actualmente un generador general aprobado.',
              'Iteraciones anteriores de producción asistida de borradores se conservan como antecedentes experimentales. Permitieron detectar problemas reales —longitud rígida, exceso de trama, ritmo de entrevista, artificialidad por repetición y regresiones entre restricciones—, pero ninguna de esas implementaciones gobierna actualmente COR002.')
          rep('conocimiento/CORPUS.md',
              '- sólo después de contar con escenas aceptadas se decidirá qué reglas o capacidades debe recuperar un futuro generador.',
              '- sólo después de contar con escenas aceptadas se decidirán los requisitos de cualquier futura herramienta de apoyo a la producción de borradores.')
          rep('conocimiento/CORPUS.md',
              'La evidencia procedente de hablantes, habla espontánea, elicitación dirigida, juicios, corrección ortográfica, bibliografía, pruebas del dispositivo, validación pedagógica y trabajo de audio puede modificar sus categorías y relaciones.',
              'La evidencia procedente de hablantes, habla espontánea, elicitación dirigida, juicios, corrección ortográfica, bibliografía, validación pedagógica y trabajo de audio puede modificar sus categorías y relaciones. Los resultados de líneas técnicas sólo participan después de ser adjudicados dentro del Sistema de Conocimiento.')

          # BACKLOG: technical implementation leaves canonical backlog; retain research debt.
          p=Path('02_BACKLOG.md'); t=p.read_text(encoding='utf-8')
          start=t.index('### BL-017 — Evaluación futura del generador de borradores')
          end=t.index('---', start)
          replacement='''### BL-017 — Tarea técnica transferida fuera del backlog canónico\n\n**Estado:** Superado como tarea del Sistema de Conocimiento  \n**Fecha:** 2026-09-02\n\nLa evaluación de herramientas de producción de borradores es una tarea técnica/operativa y no una deuda estructural del Sistema de Conocimiento. Su genealogía se conserva y su continuación pasa a `dispositivo/BACKLOG_TECNICO.md` como `DT-001`.\n\nLas preguntas pedagógicas sobre aceptabilidad, artificialidad, cobertura y utilidad siguen perteneciendo a las vistas y validaciones humanas correspondientes; ninguna herramienta define esos criterios por sí misma.\n\n'''
          t=t[:start]+replacement+t[end:]
          start=t.index('### BL-022 — Implementar capas analíticas finas derivadas de BIB065')
          end=t.index('---', start)
          replacement='''### BL-022 — Investigar la relevancia pedagógica de capas analíticas finas derivadas de BIB065\n\n**Estado:** Abierto  \n**Prioridad:** Media / investigación continua\n\nDeterminar cuáles de las distinciones descriptivas derivadas de BIB065/Bueno Holle tienen consecuencias pedagógicas reales, cuáles ya quedan suficientemente representadas por G o P, cuáles requieren una descripción adicional y cuáles son únicamente propiedades lingüísticas sin necesidad de convertirse en escala curricular.\n\nEntre las capas candidatas se encuentran:\n\n- introducción, mantenimiento y reintroducción de referentes;\n- continuidad y cambio de tópico;\n- tipos y posiciones de foco;\n- estado informativo e información compartida;\n- relaciones entre preguntas y respuestas;\n- unidades entonacionales y organización prosódica;\n- forma explícita, clítico u omisión según contexto.\n\nLa investigación debe volver a la fuente bibliográfica original y contrastarse con escenas, corpus oral, hablantes y aprendices. Los artefactos técnicos pueden ayudar a localizar preguntas, pero no constituyen la autoridad de esta tarea.\n\n**No bloquea:** COR002, el corpus oral ni otras líneas de investigación.\n\n**Criterio de cierre:** existe una decisión documentada sobre qué relevancia pedagógica tienen las capas priorizadas, o se determina explícitamente que deben permanecer sólo como descripción lingüística.\n\n**Componente técnico transferido:** la eventual representación computacional de capas ya adjudicadas pasa a `dispositivo/BACKLOG_TECNICO.md` como `DT-002`.\n\n'''
          t=t[:start]+replacement+t[end:]
          t=t.replace('cómo debe relacionarse con futuras secuencias curriculares y generadores;','cómo debe relacionarse con futuras secuencias curriculares y usos operativos;')
          t=t.replace('La investigación de P y la implementación de capas BIB065 se registran como deudas estructurales,','La investigación de P y la relevancia pedagógica de capas BIB065 se registran como deudas estructurales,')
          p.write_text(t,encoding='utf-8')
          PY
          git config user.name lopezcarlton
          git config user.email lopezcarlton@gmail.com
          git add conocimiento/PEDAGOGIA.md conocimiento/CORPUS.md 02_BACKLOG.md
          git commit -m 'remove technical deference from canonical knowledge views'
          git push origin HEAD:main
