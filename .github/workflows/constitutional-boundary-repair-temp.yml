name: constitutional-boundary-repair-temp

on:
  push:
    paths:
      - '.github/workflows/constitutional-boundary-repair-temp.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Patch architecture and quarantine malformed principles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); t=p.read_text(encoding='utf-8')
              n=t.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected 1 match, got {n}: {old[:100]!r}')
              p.write_text(t.replace(old,new,1),encoding='utf-8')

          # Architecture v0.2: no competing constitutional document; add derived-system boundary.
          replace_once('00_ARQUITECTURA_DEL_CONOCIMIENTO.md','version: 0.1','version: 0.2')
          replace_once('00_ARQUITECTURA_DEL_CONOCIMIENTO.md','fecha: 05/08/2026','fecha: 02/09/2026')
          anchor='Estas vistas no constituyen la fuente primaria de verdad. Son representaciones organizadas del conocimiento vigente.\n\n---\n\n# 4. Entidades del sistema'
          addition='''Estas vistas no constituyen la fuente primaria de verdad. Son representaciones organizadas del conocimiento vigente.\n\n## 3.5 Sistemas derivados y frontera de autoridad\n\nLas herramientas, implementaciones, repositorios técnicos y otros sistemas derivados **no constituyen una quinta capa del Sistema de Conocimiento** ni adquieren autoridad por consumirlo o procesarlo.\n\nPueden:\n\n* leer conocimiento aprobado;\n* ejecutar análisis y pruebas;\n* detectar contradicciones o vacíos;\n* formular requisitos;\n* proponer candidatos de hallazgo, supuesto, interpretación o decisión.\n\nNo pueden por sí mismos:\n\n* adoptar conocimiento;\n* promover un candidato a entidad vigente;\n* modificar una decisión, principio o vista canónica;\n* convertir una salida técnica en evidencia lingüística, pedagógica o comunitaria.\n\nCuando una lectura o descubrimiento ocurra durante trabajo en un sistema derivado, debe volver a la fuente original y seguir el procedimiento de actualización de Voces de las Nubes antes de incorporarse. Un informe técnico puede documentar el comportamiento de la herramienta que lo produjo, pero no sustituye la autoridad pertinente sobre otros dominios.\n\nLa relación es bidireccional en información y unidireccional en autoridad:\n\n```text\nVOCES -> conocimiento aprobado -> sistemas derivados\nsistemas derivados -> candidatos / contradicciones / requisitos -> VOCES\nVOCES -> adjudicación -> conocimiento aprobado\n```\n\nLos futuros desarrolladores de sistemas derivados no tendrán por defecto capacidad de escritura sobre el Sistema de Conocimiento. Los controles de acceso y, cuando sea viable, la separación física de repositorios deben reflejar esta regla.\n\nReferencia: `DEC-AUTORIDAD-SISTEMA-CONOCIMIENTO`.\n\n---\n\n# 4. Entidades del sistema'''
          replace_once('00_ARQUITECTURA_DEL_CONOCIMIENTO.md',anchor,addition)
          p=Path('00_ARQUITECTURA_DEL_CONOCIMIENTO.md')
          t=p.read_text(encoding='utf-8')
          if '## Actualización v0.2 — 2026-09-02' not in t:
              t += '''\n\n---\n\n## Actualización v0.2 — 2026-09-02\n\n- Se formaliza la frontera de autoridad entre el Sistema de Conocimiento y sistemas derivados.\n- Se establece que los sistemas derivados pueden descubrir y proponer, pero no adoptar, promover ni escribir conocimiento.\n- Se establece que los permisos de desarrollo técnico no implican permisos de escritura sobre el Sistema de Conocimiento.\n- La actualización responde a `HALL-0008` y `DEC-AUTORIDAD-SISTEMA-CONOCIMIENTO`.\n'''
              p.write_text(t,encoding='utf-8')

          # Quarantine three malformed PRIN objects without silently reclassifying their substance.
          repairs={
            'conocimiento/principios/PRIN-G-RESTRICCION-DURA.md':('estado: provisional_suspended_as_hard_generator_rule','estado: en_revision'),
            'conocimiento/principios/PRIN-P-RESTRICCION-BLANDA.md':('estado: provisional_not_automatic_generator_policy','estado: en_revision'),
            'conocimiento/principios/PRIN-COMPETENCIA-COMUNICATIVA-MULTIDIMENSIONAL.md':('estado: vigente_como_principio_general_aplicacion_revisable','estado: en_revision'),
          }
          notice='''\n\n## Auditoría de esquema — 2026-09-02\n\n**Autoridad normativa temporal:** `SUSPENDED_PENDING_ENTITY_ADJUDICATION`\n\nEste archivo fue localizado con un estado y/o campos que no cumplen el esquema `PRIN` definido en `00_ARQUITECTURA_DEL_CONOCIMIENTO.md` §4.5. Se conserva íntegramente como antecedente, pero no debe utilizarse como principio vigente hasta decidir qué contenido corresponde realmente a principio, decisión, supuesto, aplicación teórica o historia de implementación.\n\nLa suspensión no resuelve el fondo de G/P ni modifica sus preguntas de investigación.\n'''
          for path,(old,new) in repairs.items():
              replace_once(path,old,new)
              p=Path(path); t=p.read_text(encoding='utf-8')
              if '## Auditoría de esquema — 2026-09-02' not in t:
                  p.write_text(t.rstrip()+notice+'\n',encoding='utf-8')

          # Remove the explicit inverted provenance from PRIN-P; do not invent a replacement authority.
          p=Path('conocimiento/principios/PRIN-P-RESTRICCION-BLANDA.md')
          t=p.read_text(encoding='utf-8')
          bad='  - dispositivo/pedagogia/PEDAGOGICAL_DISCUSSION_FREEZE_POST_BIB065_v0_36_2.md\n'
          if bad in t:
              t=t.replace(bad,'')
          marker='provenance:\n'
          if 'provenance_status:' not in t:
              t=t.replace(marker,'provenance_status: "PENDING_REFOUNDATION_FROM_KNOWLEDGE_SOURCES; device provenance removed 2026-09-02"\n\n'+marker,1)
          p.write_text(t,encoding='utf-8')
          PY
          git config user.name lopezcarlton
          git config user.email lopezcarlton@gmail.com
          git add 00_ARQUITECTURA_DEL_CONOCIMIENTO.md conocimiento/principios/PRIN-G-RESTRICCION-DURA.md conocimiento/principios/PRIN-P-RESTRICCION-BLANDA.md conocimiento/principios/PRIN-COMPETENCIA-COMUNICATIVA-MULTIDIMENSIONAL.md
          git commit -m 'repair constitutional boundary and quarantine malformed principles'
          git push origin HEAD:main
