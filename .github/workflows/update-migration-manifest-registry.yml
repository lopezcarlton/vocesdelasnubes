name: update migration manifest registry once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-migration-manifest-registry.yml'

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update migration manifest
        shell: python
        run: |
          from pathlib import Path
          p = Path('dispositivo/migracion/MIGRATION_MANIFEST_v1.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('**Última actualización:** 2026-09-02 — runtime v0.2.10 documentary alignment recuperado', '**Última actualización:** 2026-09-02 — documentary alignment registry v0.2.15.2 transferido byte-exacto')
          anchor = '| `dispositivo/runtime/v0_2_15_3/didxaza_runtime_v0_2_10_documentary_alignment.py` | módulo exacto v0.2.10 requerido por el runner v0.2.15.3 |'
          row = '| `dispositivo/runtime/v0_2_15_3/DOCUMENTARY_ALIGNMENT_REGISTRY_v0_2_15_2.csv` | registry exacto reutilizado desde v0.2.10; SHA-256 y Git blob verificados |'
          if row not in s:
              s = s.replace(anchor, anchor + '\n' + row)
          s = s.replace('**31/75 payloads exactos recuperados** y 44 aún ausentes', '**32/75 payloads exactos recuperados** y 43 aún ausentes')
          old = 'Por tanto la evidencia disponible demuestra continuidad byte a byte del contenido del registry entre el nombre histórico v0.2.10 y el nombre de release v0.2.15.2. La fuente completa está localizada, pero **todavía no se migró al árbol** porque conserva BOM UTF-8 y terminadores CRLF y la vía de escritura disponible no garantiza transferencia byte-exacta del CSV. No se normalizó ni reconstruyó.'
          new = 'Por tanto la evidencia disponible demuestra continuidad byte a byte del contenido del registry entre el nombre histórico v0.2.10 y el nombre de release v0.2.15.2. El archivo fue transferido al árbol sin normalización ni reconstrucción. Conserva BOM UTF-8 y terminadores CRLF. Verificación: `SHA256 = a4103fa943d6a5770d441c8b6db82b79fd98020de4d185d0cc8b725cf58d92cf`; `GIT_BLOB = 127c48ddfdac41f34359f3871f65e6aa4e759452`; `STATUS = EXACT_RELEASE_IDENTITY_VERIFIED`.'
          s = s.replace(old, new)
          s = s.replace('| `DOCUMENTARY_ALIGNMENT_REGISTRY_v0_2_10.csv` → release name `DOCUMENTARY_ALIGNMENT_REGISTRY_v0_2_15_2.csv` | `SOURCE_COMPLETE_READY_TO_MIGRATE / EXACT_BYTE_TRANSFER_PENDING` | `a4103fa943d6a5770d441c8b6db82b79fd98020de4d185d0cc8b725cf58d92cf` |', '| `DOCUMENTARY_ALIGNMENT_REGISTRY_v0_2_10.csv` → release name `DOCUMENTARY_ALIGNMENT_REGISTRY_v0_2_15_2.csv` | `MIGRATED / EXACT_RELEASE_IDENTITY_VERIFIED` | `a4103fa943d6a5770d441c8b6db82b79fd98020de4d185d0cc8b725cf58d92cf` |')
          s = s.replace('### Runtime v0.2.15.3 — 44/75 payloads aún ausentes', '### Runtime v0.2.15.3 — 43/75 payloads aún ausentes')
          s = s.replace('siguen faltando **siete dependencias directas**:', 'siguen faltando **seis dependencias directas**:')
          s = s.replace('DOCUMENTARY_ALIGNMENT_REGISTRY_v0_2_15_2.csv\n', '')
          s = s.replace('\nLa fuente exacta del `DOCUMENTARY_ALIGNMENT_REGISTRY` ya está localizada dentro del paquete v0.2.10 y coincide por SHA con la identidad del release; sólo falta transferencia byte-exacta al árbol.\n', '\nEl `DOCUMENTARY_ALIGNMENT_REGISTRY_v0_2_15_2.csv` ya está transferido y verificado byte-exacto.\n')
          s = s.replace('1. transferir byte-exacto `DOCUMENTARY_ALIGNMENT_REGISTRY_v0_2_15_2.csv` desde la fuente ya localizada;\n2. recuperar `didxaza_runtime_v0_2_11_pickett_backfill.py` y su fuente completa;\n3. recuperar v0.2.12 y v0.2.14;\n4. recuperar `COR001_REPLAY_INPUT_v0_2_15_2.csv`, `PICKETT_LEXICON_BACKFILL_v0_1.csv` y `PERSON_POSSESSION_EXACT_REGISTRY_v0_2_15_2.csv`;\n5. sólo entonces regenerar el replay en directorio aislado para verificar reproducibilidad técnica;\n6. recuperar en paralelo `TutorCaseLicenseBindings_v0_33.jsonl` y las licencias C03/C05 exactas del Tutor.', '1. recuperar `didxaza_runtime_v0_2_11_pickett_backfill.py` y su fuente completa;\n2. recuperar v0.2.12 y v0.2.14;\n3. recuperar `COR001_REPLAY_INPUT_v0_2_15_2.csv`, `PICKETT_LEXICON_BACKFILL_v0_1.csv` y `PERSON_POSSESSION_EXACT_REGISTRY_v0_2_15_2.csv`;\n4. sólo entonces regenerar el replay en directorio aislado para verificar reproducibilidad técnica;\n5. recuperar en paralelo `TutorCaseLicenseBindings_v0_33.jsonl` y las licencias C03/C05 exactas del Tutor.')
          s = s.replace('**Siguiente P0 recomendado:** transferir byte-exacto el registry ya localizado y, después, recuperar el paquete/fuente de `didxaza_runtime_v0_2_11_pickett_backfill.py`.', '**Siguiente P0 recomendado:** recuperar el paquete/fuente de `didxaza_runtime_v0_2_11_pickett_backfill.py`.')
          marker = '9b33c78673b5de5bcb56c351e612c6cc4a09ef39  migrate exact runtime v0.2.10 documentary alignment\n'
          add = '1e0a31eb1f583abad07beda41c3e8fbb41a537a1  migrate exact documentary alignment registry v0.2.15.2\n821e9bd6cb6dc38bcbeb378c5c8b66f4f5429902  remove temporary exact registry migration helper\n'
          if '1e0a31eb1f583abad07beda41c3e8fbb41a537a1' not in s:
              s = s.replace(marker, marker + add)
          p.write_text(s, encoding='utf-8')
      - name: Commit manifest update
        shell: bash
        run: |
          git config user.name 'migration-agent'
          git config user.email 'migration-agent@users.noreply.github.com'
          git add dispositivo/migracion/MIGRATION_MANIFEST_v1.md
          git diff --cached --quiet && exit 0
          git commit -m 'record exact documentary registry migration'
          git push
