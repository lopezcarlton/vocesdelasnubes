name: post-irma-entity-schema-audit-temp

on:
  push:
    paths:
      - '.github/workflows/post-irma-entity-schema-audit-temp.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Normalize new entities and audit schemas
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def patch(path, replacements):
              p=Path(path); s=p.read_text(encoding='utf-8')
              for old,new in replacements:
                  if old not in s:
                      raise SystemExit(f'missing patch anchor in {path}: {old!r}')
                  s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')

          # Normalize only entities created during the post-Irma intake.
          patch('conocimiento/fuentes/SRC-IRMA-PINEDA-REUNION-2026-09-02.md', [
              ('nivel_de_fuente: memoria_posterior','nivel_de_fuente: secundaria')])
          patch('conocimiento/fuentes/SRC-DICTIONARIA-NORMA-ESCRITURA-2016-REFERENCE.md', [
              ('fecha_de_consulta: 2026-09-02','fecha: 2016\nfecha_de_consulta: 2026-09-02'),
              ('nivel_de_fuente: secundaria_para_existencia_y_uso_de_la_norma','nivel_de_fuente: secundaria')])
          patch('conocimiento/fuentes/SRC-INALI-INFORME-LOGROS-2016-NORMA-PLANICIE-COSTERA.md', [
              ('nivel_de_fuente: primaria_institucional','nivel_de_fuente: primaria')])
          patch('conocimiento/fuentes/SRC-CARDONA-2020-DIALECTOLOGIA-ZAPOTECO-ISTMO.md', [
              ('nivel_de_fuente: primaria_de_investigacion','nivel_de_fuente: primaria')])
          patch('conocimiento/fuentes/SRC-CARDONA-VICENTE-2025-VARIACION-ESCRITURA.md', [
              ('nivel_de_fuente: secundaria_analitica_con_base_empirica_previa','nivel_de_fuente: secundaria')])
          patch('conocimiento/fuentes/SRC-CORONADO-2020-SEGMENTACION-DIIDXAZA-NINOS.md', [
              ('fecha_de_publicacion_repositorio: 2020-01-13','fecha: 2019\nfecha_de_publicacion_repositorio: 2020-01-13'),
              ('nivel_de_fuente: primaria_de_investigacion','nivel_de_fuente: primaria')])
          patch('conocimiento/fuentes/SRC-DE-ANDA-2023-ESCRITURA-SONIDOS-DIIDXAZA-NINOS.md', [
              ('fecha_de_publicacion_repositorio: 2023-02-01','fecha: 2022\nfecha_de_publicacion_repositorio: 2023-02-01'),
              ('nivel_de_fuente: primaria_de_investigacion','nivel_de_fuente: primaria')])

          patch('conocimiento/hallazgos/HALL-0009.md', [
              ('tipo: laguna_estructural','tipo: necesidad'),
              ('grado_de_respaldo: directo_documental_y_memoria_posterior','grado_de_respaldo: inferido')])
          patch('conocimiento/hallazgos/HALL-0010.md', [
              ('tipo: hallazgo_documental','tipo: hallazgo_institucional'),
              ('grado_de_respaldo: convergente_alto_para_existencia_no_para_texto_completo','participantes:\n  - Instituto Nacional de Lenguas Indígenas\n  - equipo Dictionaria Didxazá\ngrado_de_respaldo: múltiple')])
          patch('conocimiento/hallazgos/HALL-0011.md', [
              ('tipo: hallazgo_documental','tipo: hallazgo_bibliografico'),
              ('fecha_de_registro: 2026-09-02','fecha_del_hecho: "2020-2025"\nfecha_de_registro: 2026-09-02'),
              ('grado_de_respaldo: convergente_alto_dentro_del_alcance_de_las_fuentes','participantes:\n  - Pedro David Cardona Fuentes\n  - David Eduardo Vicente Jiménez\ngrado_de_respaldo: múltiple')])
          patch('conocimiento/hallazgos/HALL-0012.md', [
              ('tipo: hallazgo_documental','tipo: hallazgo_bibliografico'),
              ('fecha_de_registro: 2026-09-02','fecha_del_hecho: "2019-2022"\nfecha_de_registro: 2026-09-02'),
              ('grado_de_respaldo: convergente_en_contexto_escolar_localizado','participantes:\n  - Nancy Coronado Cisneros\n  - Tania Mirelle De Anda Trejo\n  - estudiantes bilingües de Rancho El Llano\ngrado_de_respaldo: múltiple')])

          required = {
            'SRC': ['id','tipo','titulo','autor_o_participantes','fecha','ubicacion','descripcion','nivel_de_fuente','estado_de_acceso'],
            'HALL':['id','titulo','afirmacion','tipo','estado','fecha_del_hecho','fecha_de_registro','fuentes','participantes','grado_de_respaldo','alcance','etiquetas','relaciones'],
            'DEC':['id','titulo','decision','estado','fecha','responsable','validadores','hallazgos_que_la_sustentan','principios_relacionados','supuestos_implicados','alternativas_consideradas','justificacion','impacta_a','reemplaza','reemplazada_por','condiciones_de_revision'],
          }
          allowed_hall_types={'observacion','declaracion','resultado','patron','contradiccion','limitacion','necesidad','oportunidad','cambio','interpretacion','hallazgo_bibliografico','hallazgo_institucional'}
          allowed_hall_states={'registrado','corroborado','cuestionado','contradicho','reemplazado','descartado','pendiente_de_revision','pendiente_de_validacion'}
          allowed_support={'directo','múltiple','parcial','inferido','débil','sin_respaldo'}
          allowed_dec_states={'propuesta','en_validacion','vigente','vigente_con_reservas','suspendida','reemplazada','revocada','descartada'}
          allowed_source_levels={'primaria','secundaria','terciaria'}

          def top_fields(text):
              return {m.group(1): m.group(2).strip().strip('"\'') for m in re.finditer(r'(?m)^([A-Za-z_áéíóúÁÉÍÓÚñÑ0-9_-]+):\s*(.*)$', text)}

          rows=[]
          for kind,folder,prefix in [('SRC','conocimiento/fuentes','SRC-'),('HALL','conocimiento/hallazgos','HALL-'),('DEC','conocimiento/decisiones','DEC-')]:
              for p in sorted(Path(folder).glob(prefix+'*.md')):
                  fields=top_fields(p.read_text(encoding='utf-8-sig'))
                  missing=[x for x in required[kind] if x not in fields]
                  vocab=[]
                  if kind=='SRC' and fields.get('nivel_de_fuente') and fields['nivel_de_fuente'] not in allowed_source_levels:
                      vocab.append('nivel_de_fuente='+fields['nivel_de_fuente'])
                  if kind=='HALL':
                      if fields.get('tipo') and fields['tipo'] not in allowed_hall_types: vocab.append('tipo='+fields['tipo'])
                      if fields.get('estado') and fields['estado'] not in allowed_hall_states: vocab.append('estado='+fields['estado'])
                      if fields.get('grado_de_respaldo') and fields['grado_de_respaldo'] not in allowed_support: vocab.append('grado='+fields['grado_de_respaldo'])
                  if kind=='DEC' and fields.get('estado') and fields['estado'] not in allowed_dec_states:
                      vocab.append('estado='+fields['estado'])
                  rows.append((kind,str(p),missing,vocab))

          newset={
            'conocimiento/fuentes/SRC-IRMA-PINEDA-REUNION-2026-09-02.md',
            'conocimiento/fuentes/SRC-DICTIONARIA-NORMA-ESCRITURA-2016-REFERENCE.md',
            'conocimiento/fuentes/SRC-INALI-INFORME-LOGROS-2016-NORMA-PLANICIE-COSTERA.md',
            'conocimiento/fuentes/SRC-CARDONA-2020-DIALECTOLOGIA-ZAPOTECO-ISTMO.md',
            'conocimiento/fuentes/SRC-CARDONA-VICENTE-2025-VARIACION-ESCRITURA.md',
            'conocimiento/fuentes/SRC-CORONADO-2020-SEGMENTACION-DIIDXAZA-NINOS.md',
            'conocimiento/fuentes/SRC-DE-ANDA-2023-ESCRITURA-SONIDOS-DIIDXAZA-NINOS.md',
            'conocimiento/hallazgos/HALL-0009.md','conocimiento/hallazgos/HALL-0010.md','conocimiento/hallazgos/HALL-0011.md','conocimiento/hallazgos/HALL-0012.md',
            'conocimiento/decisiones/DEC-PUBLICOS-ESCOLARES-MULTIETARIOS.md'
          }
          newbad=[r for r in rows if r[1] in newset and (r[2] or r[3])]
          historical=[r for r in rows if r[1] not in newset and (r[2] or r[3])]

          for r in newbad:
              print('NEWBAD',r)
          print('AUDIT_COUNTS',{'entities':len(rows),'newbad':len(newbad),'historical':len(historical)})

          out=['# AUDITORÍA DE ESQUEMAS DE ENTIDADES — POST-IRMA — 2026-09-02','',
               '**Estado:** `AUDIT_REPORT / NON_NORMATIVE`','',
               f'- Entidades auditadas: **{len(rows)}**',
               f'- Entidades nuevas post-Irma con incumplimiento tras normalización: **{len(newbad)}**',
               f'- Deuda histórica/preexistente detectada: **{len(historical)}**','',
               '## Entidades nuevas post-Irma','']
          if newbad:
              for kind,p,missing,vocab in newbad:
                  out.append(f'- **FAIL** `{p}` — missing={missing}; vocab={vocab}')
          else:
              out.append('- **PASS:** todos los SRC/HALL/DEC creados en esta fase cumplen campos mínimos y vocabularios controlados auditados.')
          out+=['','## Deuda histórica/preexistente','']
          if historical:
              for kind,p,missing,vocab in historical:
                  out.append(f'- `{p}` — missing={missing or "—"}; vocab={vocab or "—"}')
          else: out.append('- Ninguna detectada por esta auditoría.')
          out+=['','## Regla','',
                'La deuda histórica listada no se corrige automáticamente: puede reflejar entidades antiguas, variantes de esquema o decisiones que requieren adjudicación. El objetivo de esta pasada es impedir que la fase post-Irma añada deuda nueva.']
          Path('informes/ENTITY_SCHEMA_AUDIT_POST_IRMA_2026-09-02.md').write_text('\n'.join(out)+'\n',encoding='utf-8')
          if newbad:
              raise SystemExit('new post-Irma entities still fail schema audit')
          PY
          git config user.name lopezcarlton
          git config user.email lopezcarlton@gmail.com
          git add conocimiento/fuentes conocimiento/hallazgos informes/ENTITY_SCHEMA_AUDIT_POST_IRMA_2026-09-02.md
          git commit -m 'normalize post-Irma entities and record schema audit'
          git push origin HEAD:main
