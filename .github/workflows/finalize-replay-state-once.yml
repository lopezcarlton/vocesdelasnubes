name: finalize replay state once

on:
  push:
    paths:
      - '.github/workflows/finalize-replay-state-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch documentary state and manualize replay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          manifest = 'dispositivo/migracion/MIGRATION_MANIFEST_v1.md'
          replace_once(
              manifest,
              '**Última actualización:** 2026-09-02 — consolidado el cierre de migración histórica y reentrada desde GitHub; integrado `MIGRATION_MANIFEST_ADDENDUM_2026-09-02.md`.',
              '**Última actualización:** 2026-09-02 — consolidada la migración histórica y verificada la reproducibilidad técnica aislada del replay v0.2.15.3; COR001 permanece `ANALYSIS_TARGET_ONLY`.'
          )
          replace_once(
              manifest,
              '| `dispositivo/migracion/REENTRY_CHECKPOINT_2026-09-02.md` | cierre de reentrada; `NON_CANONICAL` |',
              '| `dispositivo/migracion/REENTRY_CHECKPOINT_2026-09-02.md` | cierre de reentrada; `NON_CANONICAL` |\n| `dispositivo/migracion/ISOLATED_REPLAY_VERIFICATION_v0_2_15_3_2026-09-02.md` | evidencia del replay aislado; `TECHNICAL_REPRODUCIBILITY_PASS / NON_LINGUISTIC_AUTHORITY` |'
          )
          replace_once(
              manifest,
              'El slice final de semántica de superficie y la cadena histórica de 38 pruebas permanecen reproducibles desde artefactos almacenados. Todas las dependencias directas conocidas del replay histórico están ahora materializadas, pero el replay end-to-end todavía no se ha regenerado en un directorio aislado.',
              'El slice final de semántica de superficie y la cadena histórica de 38 pruebas permanecen reproducibles desde artefactos almacenados. El replay histórico v0.2.15.3 fue regenerado en un checkout aislado de GitHub Actions y obtuvo `PASS` técnico: todas las dependencias directas verificadas coincidieron con el release y los outputs deterministas `SUMMARY` y `METRICS` reprodujeron exactamente sus SHA-256 históricos. Ver `ISOLATED_REPLAY_VERIFICATION_v0_2_15_3_2026-09-02.md`. Esto no concede autoridad lingüística a COR001.'
          )
          replace_once(
              manifest,
              '### P0 — conservar estado reproducible\n\n1. regenerar el replay histórico v0.2.15.3 en directorio aislado y comparar únicamente reproducibilidad técnica;\n2. recuperar `TutorCaseLicenseBindings_v0_33.jsonl` y las licencias C03/C05 exactas del Tutor sólo si aparecen como fuentes completas.',
              '### P0 — conservar estado reproducible\n\n1. recuperar `TutorCaseLicenseBindings_v0_33.jsonl` y las licencias C03/C05 exactas del Tutor sólo si aparecen como fuentes completas.\n\nEl replay histórico v0.2.15.3 ya no es un pendiente: su reproducibilidad técnica aislada fue verificada el 2026-09-02. Futuras ejecuciones son manuales y no constituyen una suite de regresión COR001.'
          )
          replace_once(
              manifest,
              '- El replay end-to-end todavía no se ha regenerado, así que no se declara `CLOSED_PASS` reproducido.',
              '- El replay end-to-end v0.2.15.3 fue regenerado aisladamente y obtuvo `TECHNICAL_REPRODUCIBILITY_PASS`; `SUMMARY` y `METRICS` coinciden byte por byte con el release. Durante la verificación se detectó y corrigió una normalización LF→CRLF de transporte en `PERSON_POSSESSION_EXACT_REGISTRY_v0_2_15_2.csv`, sin cambio de celdas.'
          )
          replace_once(
              manifest,
              '## 12. Próxima acción\n\n**Siguiente P0 imprescindible para reproducir el estado:** regenerar el replay histórico v0.2.15.3 en un directorio aislado usando las dependencias exactas ahora materializadas.\n\nEl objetivo es comparar reproducibilidad técnica con los artefactos de cierre almacenados, no convertir COR001 en benchmark, gold, regresión ni fuente de reglas.\n\nDesde el punto de vista de migración entre chats, este chat ya puede considerarse suficientemente migrado. La investigación lingüística y pedagógica puede continuar sin esperar al replay técnico.',
              '## 12. Próxima acción\n\nNo queda un replay P0 pendiente. La recuperación del Tutor v0.33 sólo debe continuar si aparecen sus dependencias exactas; no bloquea investigación.\n\nDesde el punto de vista de migración entre chats y reproducibilidad técnica del replay histórico, el repositorio está suficientemente cerrado para reentrada. La ruta sustantiva vuelve a literatura lingüística, corpus oral independiente de Juchitán y discusión pedagógica abierta. COR001 permanece `ANALYSIS_TARGET_ONLY`.'
          )

          state = 'dispositivo/migracion/CURRENT_EXECUTABLE_STATE_v1.md'
          replace_once(
              state,
              'Esto reproduce el slice unitario de integridad de semántica de superficie. La cadena histórica de 38 pruebas también es ejecutable conforme a la sección siguiente. Los módulos v0.2.10, v0.2.11, v0.2.12 y v0.2.14 y todas las dependencias directas identificadas para el replay histórico están ahora materializados. El replay de COR001 todavía no se ha regenerado ni se han recalculado de forma independiente los 26 criterios del `CLOSED_PASS`.\n\nEstado del replay end-to-end:\n\n`DIRECT_DEPENDENCIES_COMPLETE / READY_FOR_ISOLATED_REPLAY_REGENERATION / NOT_YET_REGENERATED`.',
              'Esto reproduce el slice unitario de integridad de semántica de superficie. La cadena histórica de 38 pruebas también es ejecutable conforme a la sección siguiente. Los módulos v0.2.10, v0.2.11, v0.2.12 y v0.2.14 y todas las dependencias directas identificadas para el replay histórico están materializados. El replay histórico de COR001 fue además regenerado en un checkout aislado de GitHub Actions: runner `exit 0`, dependencias directas exactas y outputs deterministas `SUMMARY`/`METRICS` byte-idénticos al release. Esto verifica reproducibilidad técnica del runner, no los 26 criterios lingüísticos ni autoridad sobre COR001.\n\nEstado del replay end-to-end:\n\n`ISOLATED_REPLAY_REPRODUCED / TECHNICAL_REPRODUCIBILITY_PASS / NON_AUTHORITATIVE / COR001_ANALYSIS_TARGET_ONLY`.\n\nEvidencia: `migracion/ISOLATED_REPLAY_VERIFICATION_v0_2_15_3_2026-09-02.md`.'
          )
          replace_once(
              state,
              'Con esto no queda ninguna dependencia directa conocida faltante para intentar la regeneración aislada del replay histórico. La presencia del input COR001 no cambia su rol: `ANALYSIS_TARGET_ONLY`.',
              'Con esto no queda ninguna dependencia directa conocida faltante para el replay histórico y la regeneración aislada ya fue ejecutada con `PASS` técnico. Durante esa verificación se restauró la representación byte-exacta histórica de `PERSON_POSSESSION_EXACT_REGISTRY_v0_2_15_2.csv` (`UTF-8 BOM + CRLF + final newline`, SHA-256 `3f1e955a...d20bdb`), corrigiendo sólo una normalización de transporte. La presencia del input y el éxito técnico no cambian el rol de COR001: `ANALYSIS_TARGET_ONLY`.'
          )

          checkpoint = 'dispositivo/migracion/REENTRY_CHECKPOINT_2026-09-02.md'
          replace_once(
              checkpoint,
              '**Estado:** `HISTORICAL_CHAT_MIGRATION_SUFFICIENT / REENTRY_READY / MANIFEST_CONSOLIDATED / NON_CANONICAL`',
              '**Estado:** `HISTORICAL_CHAT_MIGRATION_SUFFICIENT / REENTRY_READY / MANIFEST_CONSOLIDATED / REPLAY_TECHNICALLY_REPRODUCED / NON_CANONICAL`'
          )
          replace_once(
              checkpoint,
              '- runtime v0.2.15.3: subconjunto exacto materializado, con dependencias directas conocidas para el replay histórico presentes;',
              '- runtime v0.2.15.3: subconjunto exacto materializado; replay histórico aislado reproducido con `TECHNICAL_REPRODUCIBILITY_PASS` y outputs deterministas exactos;'
          )
          replace_once(
              checkpoint,
              '- la regeneración técnica del replay v0.2.15.3.\n\nEl replay puede ejecutarse una sola vez desde el repositorio como prueba de reproducibilidad técnica. Un `PASS` no concede autoridad lingüística a COR001.',
              '- futuras reejecuciones manuales del replay v0.2.15.3, que ya obtuvo `PASS` técnico el 2026-09-02.\n\nLa evidencia del cierre está en `ISOLATED_REPLAY_VERIFICATION_v0_2_15_3_2026-09-02.md`. Un `PASS` no concede autoridad lingüística a COR001.'
          )

          replay_workflow = '''name: replay-v0-2-15-3-reproducibility\n\non:\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  replay:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Run manual isolated technical replay\n        shell: bash\n        run: |\n          set -euo pipefail\n          SRC="$GITHUB_WORKSPACE/dispositivo/runtime/v0_2_15_3"\n          WORK="$RUNNER_TEMP/replay_v0_2_15_3"\n          rm -rf "$WORK"\n          mkdir -p "$WORK"\n          cp -a "$SRC/." "$WORK/"\n          cd "$WORK"\n          python run_cor001_replay_v0_2_15_3.py > REPLAY_STDOUT.txt\n          python - <<'PYVERIFY'\n          from pathlib import Path\n          import hashlib, json, sys\n          root=Path('.')\n          expected=json.loads((root/'RELEASE_FILE_MANIFEST_v0_2_15_3.json').read_text(encoding='utf-8'))['sha256']\n          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()\n          deps=['COR001_REPLAY_INPUT_v0_2_15_2.csv','DICTIONARIA_entries_v0_2_15_2.csv','DICTIONARIA_senses_v0_2_15_2.csv','DICTIONARIA_examples_v0_2_15_2.csv','DOCUMENTARY_ALIGNMENT_REGISTRY_v0_2_15_2.csv','PICKETT_LEXICON_BACKFILL_v0_1.csv','PERSON_POSSESSION_EXACT_REGISTRY_v0_2_15_2.csv','BASE_CORRECTOR_DIDXAZA_EVIDENCE_INTEGRITY_v2_19.sqlite','didxaza_runtime_v0_2_0_foundation.py','didxaza_runtime_v0_2_1_retrieval.py','didxaza_runtime_v0_2_3_morphology_i.py','didxaza_runtime_v0_2_4_bound.py','didxaza_runtime_v0_2_5_morphology_ii.py','didxaza_runtime_v0_2_6_evidence_adjudication.py','didxaza_runtime_v0_2_7_decision_simulation.py','didxaza_runtime_v0_2_9_surface_evidence_coverage.py','didxaza_runtime_v0_2_10_documentary_alignment.py','didxaza_runtime_v0_2_11_pickett_backfill.py','didxaza_runtime_v0_2_12_pickett_cross_source.py','didxaza_runtime_v0_2_14_person_possession.py','didxaza_runtime_v0_2_15_2_evidence_integrity.py','didxaza_runtime_v0_2_15_3_surface_semantics_resolution_integrity.py','run_cor001_replay_v0_2_15_3.py']\n          bad=[n for n in deps if not (root/n).exists() or sha(root/n)!=expected.get(n)]\n          outs=['COR001_REPLAY_SUMMARY_v0_2_15_3.csv','COR001_REPLAY_METRICS_v0_2_15_3.json']\n          bad_out=[n for n in outs if sha(root/n)!=expected[n]]\n          result={'status':'PASS' if not bad and not bad_out else 'FAIL','cor001_policy':'ANALYSIS_TARGET_ONLY','bad_dependencies':bad,'bad_deterministic_outputs':bad_out}\n          print(json.dumps(result,indent=2))\n          if result['status']!='PASS': sys.exit(1)\n          PYVERIFY\n\n      - name: Upload manual replay evidence\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: manual-replay-v0-2-15-3-${{ github.sha }}\n          path: |\n            ${{ runner.temp }}/replay_v0_2_15_3/REPLAY_STDOUT.txt\n            ${{ runner.temp }}/replay_v0_2_15_3/RUN_MANIFEST_COR001_v0_2_15_3.json\n            ${{ runner.temp }}/replay_v0_2_15_3/COR001_REPLAY_METRICS_v0_2_15_3.json\n            ${{ runner.temp }}/replay_v0_2_15_3/COR001_REPLAY_SUMMARY_v0_2_15_3.csv\n'''
          Path('.github/workflows/replay-v0-2-15-3.yml').write_text(replay_workflow, encoding='utf-8')
          PY

          git config user.name 'lopezcarlton'
          git config user.email 'lopezcarlton@gmail.com'
          git rm .github/workflows/finalize-replay-state-once.yml
          git add dispositivo/migracion/MIGRATION_MANIFEST_v1.md dispositivo/migracion/CURRENT_EXECUTABLE_STATE_v1.md dispositivo/migracion/REENTRY_CHECKPOINT_2026-09-02.md .github/workflows/replay-v0-2-15-3.yml
          git commit -m 'close isolated replay reproducibility checkpoint'
          git push origin HEAD:main
