name: bump-architecture-patch

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.title == 'Patch architecture version after split'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('00_ARQUITECTURA_DEL_CONOCIMIENTO.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('version: 0.3\n', 'version: 0.3.1\n', 1)
          marker = '## Actualización v0.3.1 — 2026-09-03'
          if marker not in s:
              s = s.rstrip() + '\n\n---\n\n' + marker + '\n\n- Se registra la separación física ya ejecutada de `lopezcarlton/didxaza-dispositivo`.\n- No cambia la arquitectura de autoridad ni añade capas, entidades o reglas nuevas; es un parche de correspondencia entre la Constitución y la organización física vigente.\n'
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 00_ARQUITECTURA_DEL_CONOCIMIENTO.md
          git commit -m 'Patch architecture version after physical split'
          git push origin HEAD:main
