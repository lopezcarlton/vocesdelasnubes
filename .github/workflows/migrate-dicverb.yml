name: migrate-dicverb

on:
  push:
    paths:
      - '.migration_tmp/dicverb/**'
      - '.github/workflows/migrate-dicverb.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble exact DIC_VERB source
        shell: bash
        run: |
          mkdir -p dispositivo/analyzer/inputs
          cat .migration_tmp/dicverb/chunk_*.b64 | base64 -d | xz -d > dispositivo/analyzer/inputs/DIC_VERB_2385_v0_1.csv
          echo '2bdf4afd4b61234c54585cda17ad648bfb71194e9463d193eb04a5a06aa3183d  dispositivo/analyzer/inputs/DIC_VERB_2385_v0_1.csv' | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dispositivo/analyzer/inputs/DIC_VERB_2385_v0_1.csv
          git diff --cached --quiet && exit 0
          git commit -m 'migrate DIC_VERB_2385_v0_1 exact source'
          git push
