name: irma-age-scope-sync-temp

on:
  push:
    paths:
      - '.github/workflows/irma-age-scope-sync-temp.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Sync adopted scope
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # PEDAGOGIA
          p=Path('conocimiento/PEDAGOGIA.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('**Versión:** 1.3', '**Versión:** 1.4', 1)
          s=s.replace('**Fecha:** 2026-08-31', '**Fecha:** 2026-09-02', 1)
          anchor='El sistema no se organiza como curso gramatical ni como colección de vocabulario temático. Su propósito es ayudar a que una persona reconozca y produzca funciones comunicativas reales mediante materiales breves, contextualizados y progresivos.\n'
          insert='''\n## 1.1 Públicos escolares y segmentación por edad\n\nDesde el 2 de septiembre de 2026 el proyecto adopta como requisito que los materiales puedan dirigirse a **públicos escolares diferenciados**, además de personas con transmisión intergeneracional interrumpida u otros aprendices.\n\nLa educación secundaria técnica constituye el primer anclaje institucional prioritario por la relación real de Casa de las Ciencias de Oaxaca con ese nivel y con su base de docentes, pero **no es el público exclusivo**. El proyecto debe investigar también materiales adecuados para estudiantes más pequeños y otros perfiles.\n\nLa segmentación todavía no está resuelta. Debe investigarse qué diferencias requieren adaptación pedagógica, entre ellas potencialmente:\n\n- edad y etapa escolar;\n- trayectoria lingüística familiar;\n- competencia previa en didxazá;\n- alfabetización y capacidad lectora;\n- longitud y estructura de las escenas;\n- velocidad y claridad del habla;\n- soporte visual, juego, explicación y producción;\n- formas apropiadas de evaluación y práctica.\n\nNo se equiparan automáticamente estas dimensiones:\n\n```text\nAGE_GROUP != LANGUAGE_LEVEL\nSCHOOL_GRADE != G_LEVEL\nSCHOOL_GRADE != P_LEVEL\n```\n\nLa decisión de segmentar está vigente; las bandas concretas y sus metodologías permanecen abiertas a trabajo con docentes, especialistas y estudiantes.\n'''
          if '## 1.1 Públicos escolares y segmentación por edad' not in s:
              if anchor not in s: raise SystemExit('PEDAGOGIA anchor missing')
              s=s.replace(anchor, anchor+insert, 1)
          p.write_text(s,encoding='utf-8')

          # CORPUS
          p=Path('conocimiento/CORPUS.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('**Versión:** 1.3', '**Versión:** 1.4', 1)
          s=s.replace('**Fecha:** 2026-08-31', '**Fecha:** 2026-09-02', 1)
          anchor='No constituye por sí sola la unidad primaria obligatoria de COR002 y no debe crecer mediante relleno ni cumplir una lista rígida de movimientos dramáticos.\n'
          insert='''\n\n## 2.7 Perfil de destinatario\n\nA partir de `DEC-PUBLICOS-ESCOLARES-MULTIETARIOS`, una escena o material no debe asumirse como universal para todos los aprendices. Durante su diseño y validación debe poder identificarse el **perfil de destinatario** relevante, aunque el esquema definitivo de metadatos todavía no esté cerrado.\n\nEl perfil puede incluir edad o etapa escolar, experiencia previa con la lengua, contexto de uso y otras variables pedagógicamente pertinentes. La misma función comunicativa puede requerir realizaciones, longitudes, ritmos o apoyos diferentes para públicos distintos.\n\nLa segmentación por edad no se convierte automáticamente en nivel lingüístico, G o P.\n'''
          if '## 2.7 Perfil de destinatario' not in s:
              if anchor not in s: raise SystemExit('CORPUS anchor missing')
              s=s.replace(anchor, anchor+insert, 1)
          p.write_text(s,encoding='utf-8')

          # README
          p=Path('README.md')
          s=p.read_text(encoding='utf-8')
          old='El proyecto está dirigido especialmente a personas que tienen la lengua en su historia familiar pero no la recibieron y que hoy carecen de una ruta clara para desarrollar comprensión auditiva y capacidad de conversación.'
          new='El proyecto incluye a personas que tienen la lengua en su historia familiar pero no la recibieron y, desde septiembre de 2026, adopta además como requisito explícito el diseño para **públicos escolares diferenciados por edad y trayectoria lingüística**. La educación secundaria técnica constituye el primer anclaje institucional prioritario por la relación de Casa de las Ciencias de Oaxaca con ese nivel, sin convertirse en público exclusivo.'
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('README audience anchor missing')
          p.write_text(s,encoding='utf-8')

          # BACKLOG
          p=Path('02_BACKLOG.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('**Versión:** 1.5', '**Versión:** 1.6', 1)
          s=s.replace('**Última actualización:** 2026-08-31', '**Última actualización:** 2026-09-02', 1)
          marker='\n# Criterios de cierre\n'
          block='''\n### BL-023 — Definir la segmentación de públicos escolares y perfiles de aprendizaje\n\n**Estado:** Abierto  \n**Prioridad:** Alta / estructural\n\nDesarrollar una arquitectura de públicos que permita adaptar materiales sin equiparar edad, grado escolar y competencia lingüística.\n\nDebe determinarse con evidencia:\n\n- qué tramos de edad o etapas educativas resultan pedagógicamente útiles;\n- qué cambia realmente entre esos segmentos;\n- qué papel tiene la trayectoria lingüística familiar;\n- qué dimensiones pueden mantenerse comunes;\n- cómo probar comprensibilidad, participación y progresión con docentes y estudiantes.\n\nLa educación secundaria técnica es el primer anclaje institucional prioritario, pero no cierra el alcance del proyecto.\n\n**Sustento:** `HALL-0009`, `DEC-PUBLICOS-ESCOLARES-MULTIETARIOS`.\n\n**Criterio de cierre:** existe una segmentación suficientemente justificada y revisable, con criterios de adaptación y una ruta de validación escolar.\n\n---\n\n### BL-024 — Identificar la versión vigente del Alfabeto Popular y adjudicar nuevas fuentes ortográficas contemporáneas\n\n**Estado:** Abierto  \n**Prioridad:** Alta / lingüística y documental\n\nLocalizar documentalmente la versión más reciente del Alfabeto Popular mencionada en `SRC-IRMA-PINEDA-REUNION-2026-09-02` y determinar qué textos contemporáneos pueden incorporarse como evidencia ortográfica, con qué alcance y con qué peso.\n\nLa tarea debe distinguir:\n\n- versión y procedencia exacta del alfabeto;\n- autor, edición, fecha y variedad de cada texto;\n- prosa, poesía y otros géneros;\n- convención ortográfica compartida frente a decisiones autorales o editoriales;\n- variación legítima frente a error suficientemente documentado.\n\nLa afirmación atribuida a Irma sobre autores contemporáneos se conserva como evidencia experta recordada, pero **no se convierte todavía en licencia automática de corrección**.\n\n**Criterio de cierre:** existe una política de fuentes ortográficas contemporáneas trazable, vinculada a una versión identificable del Alfabeto Popular y compatible con la variación documentada.\n\n---\n'''
          if '### BL-023 —' not in s:
              if marker not in s: raise SystemExit('BACKLOG marker missing')
              s=s.replace(marker,'\n'+block+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name lopezcarlton
          git config user.email lopezcarlton@gmail.com
          git add conocimiento/PEDAGOGIA.md conocimiento/CORPUS.md README.md 02_BACKLOG.md
          git commit -m 'adopt school-age audience scope and open structural follow-ups'
          git push origin HEAD:main
