name: validate-pb2015-valency-relations

on:
  push:
    branches:
      - "research/dictionaria-valency-relations-*"
    paths:
      - "conocimiento/derivados/PB2015_VALENCY_RELATIONS_SELECTED_v0_1.csv"
      - ".github/workflows/validate-pb2015-valency-relations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate selected PB2015 relations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json
          from collections import Counter, defaultdict
          from pathlib import Path

          path = Path('conocimiento/derivados/PB2015_VALENCY_RELATIONS_SELECTED_v0_1.csv')
          with path.open(encoding='utf-8', newline='') as f:
              reader = csv.DictReader(f)
              rows = list(reader)
              fields = reader.fieldnames

          expected_fields = [
              'relation_set_id','source_id','source_location','source_group','relation_role',
              'source_form_pdlma_raw','source_gloss_en','source_verb_class','source_valence',
              'source_acceptability_or_variation_note','relation_basis','ap_surface_assertion',
              'dictionaria_entry_resolution_status'
          ]
          assert fields == expected_fields, (fields, expected_fields)
          assert rows
          assert all(None not in row for row in rows), 'Malformed CSV row with overflow columns'
          assert all(row['source_id'] == 'SRC-PEREZ-BAEZ-2015-VALENCE-CHANGING-JUCHITAN' for row in rows)
          assert all(row['source_form_pdlma_raw'].startswith('-') for row in rows)
          assert all(row['ap_surface_assertion'] == 'false' for row in rows)
          assert all(row['dictionaria_entry_resolution_status'] == 'NOT_ATTEMPTED' for row in rows)

          by_set = defaultdict(list)
          for row in rows:
              by_set[row['relation_set_id']].append(row)
          assert all(len(members) >= 2 for members in by_set.values())

          required_groups = {'V1','V2','V3','C1','C2','C3','C4','CROSS_GROUP_EXCEPTION','EQUIPOLLENT'}
          groups = {row['source_group'] for row in rows}
          assert required_groups <= groups, (required_groups - groups)

          v1_roles = {
              row['relation_role'] for row in rows if row['source_group'] == 'V1'
          }
          assert 'MORE_ACTIVE' in v1_roles
          assert 'CAUSATIVE' not in v1_roles

          eq_sets = {
              sid: {row['relation_role'] for row in members}
              for sid, members in by_set.items()
              if any(row['source_group'] == 'EQUIPOLLENT' for row in members)
          }
          assert eq_sets
          for sid, roles in eq_sets.items():
              assert {'LESS_ACTIVE','MORE_ACTIVE'} <= roles, (sid, roles)

          stats = {
              'row_count': len(rows),
              'relation_set_count': len(by_set),
              'group_counts_rows': dict(sorted(Counter(r['source_group'] for r in rows).items())),
              'role_counts_rows': dict(sorted(Counter(r['relation_role'] for r in rows).items())),
              'groups_present': sorted(groups),
              'all_ap_surface_assertions_false': True,
              'all_dictionaria_resolution_not_attempted': True,
          }
          print('PB2015_SELECTED_RELATION_STATS=' + json.dumps(stats, ensure_ascii=False, sort_keys=True))
          PY
