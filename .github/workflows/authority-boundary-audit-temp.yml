name: authority-boundary-audit-temp

on:
  push:
    paths:
      - '.github/workflows/authority-boundary-audit-temp.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Audit knowledge authority boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root=Path('.')
          files=sorted((root/'conocimiento').rglob('*.md'))
          roots=[root/'00_ARQUITECTURA_DEL_CONOCIMIENTO.md',root/'01_JERARQUIA_DE_VERDAD.md',root/'02_BACKLOG.md',root/'03_REGLAS_DE_ACTUALIZACIÓN.md',root/'README.md',root/'INICIAR_AQUI_CHAT_NUEVO.md']
          files_all=files+[p for p in roots if p.exists()]

          device_refs=[]
          tech_mentions=[]
          provenance_device=[]
          pat=re.compile(r'(?i)\b(dispositivo|generador|generator|analyzer|analizador|tutor|runtime|automatiz\w*|software|código|codigo)\b')
          for p in files_all:
              lines=p.read_text(encoding='utf-8-sig').splitlines()
              in_prov=False
              for i,line in enumerate(lines,1):
                  low=line.lower()
                  if re.match(r'^\s*provenance\s*:',line): in_prov=True
                  elif in_prov and line and not line.startswith((' ','\t','-')): in_prov=False
                  if 'dispositivo/' in line:
                      device_refs.append((str(p),i,line.strip()))
                      if in_prov or 'provenance' in low:
                          provenance_device.append((str(p),i,line.strip()))
                  if pat.search(line):
                      tech_mentions.append((str(p),i,line.strip()))

          allowed={'propuesto','vigente','en_revision','reformulado','retirado'}
          required={'id','principio','estado','alcance','origen','hallazgos_que_lo_sustentan','autoridad_que_lo_valida','decisiones_derivadas','excepciones','condiciones_de_revision'}
          prin=[]
          for p in sorted((root/'conocimiento/principios').glob('PRIN-*.md')):
              text=p.read_text(encoding='utf-8-sig')
              fields={m.group(1):m.group(2).strip() for m in re.finditer(r'(?m)^([A-Za-z_áéíóúÁÉÍÓÚñÑ0-9-]+):\s*(.*)$',text)}
              state=fields.get('estado','').strip('"\'')
              missing=sorted(k for k in required if k not in fields)
              prin.append((str(p),state,state in allowed,missing))

          byfile={}
          for p,i,line in tech_mentions: byfile.setdefault(p,[]).append((i,line))
          out=[]
          out += ['# AUDITORÍA DE FRONTERA DE AUTORIDAD — PRE-IRMA — 2026-09-02','',
                  '**Estado:** `AUDIT_REPORT / NON_NORMATIVE / NO_AUTOMATIC_PROMOTION`','',
                  'Este informe localiza dependencias y posibles filtraciones entre el Sistema de Conocimiento y la capa técnica. No decide por sí mismo qué menciones deben eliminarse: una mención puede ser histórica o subordinante y por tanto legítima.','',
                  '## 1. Referencias directas desde conocimiento/ hacia dispositivo/','']
          if device_refs:
              for p,i,line in device_refs: out.append(f'- `{p}:{i}` — `{line}`')
          else: out.append('- Ninguna localizada.')
          out += ['','## 2. Referencias de provenance hacia dispositivo/','']
          if provenance_device:
              for p,i,line in provenance_device: out.append(f'- **INVERSIÓN CANDIDATA:** `{p}:{i}` — `{line}`')
          else: out.append('- Ninguna localizada.')
          out += ['','## 3. Cumplimiento de esquema de PRIN','',
                  '| Archivo | estado | estado permitido | campos mínimos faltantes |','|---|---|---|---|']
          for p,state,ok,missing in prin:
              out.append(f'| `{p}` | `{state}` | {"sí" if ok else "**NO**"} | {", ".join(f"`{x}`" for x in missing) if missing else "—"} |')
          out += ['','## 4. Menciones técnicas por archivo','']
          for p in sorted(byfile):
              out.append(f'### `{p}` — {len(byfile[p])} coincidencias')
              for i,line in byfile[p][:60]: out.append(f'- L{i}: `{line}`')
              if len(byfile[p])>60: out.append(f'- … {len(byfile[p])-60} coincidencias adicionales')
              out.append('')
          out += ['## 5. Regla de adjudicación para la limpieza','',
                  '```text','SUBORDINA_AL_SISTEMA_DERIVADO = admisible','DEFIERE_AUTORIDAD_AL_SISTEMA_DERIVADO = filtración','```','',
                  'Las referencias históricas se conservan cuando son necesarias para reconstruir genealogía. Las vistas pedagógicas, lingüísticas y metodológicas no deben esperar que una implementación técnica determine su contenido.','',
                  '## 6. Condición previa a separación física','',
                  'Toda referencia de `provenance` desde `conocimiento/` hacia `dispositivo/` debe adjudicarse antes de separar repositorios: ref fundamentar en la fuente primaria o entidad válida del Sistema de Conocimiento, o degradar/suspender la afirmación correspondiente.']
          path=root/'informes/AUTHORITY_BOUNDARY_AUDIT_PRE_IRMA_2026-09-02.md'
          path.parent.mkdir(exist_ok=True)
          path.write_text('\n'.join(out)+'\n',encoding='utf-8')
          print(f'wrote {path}; device_refs={len(device_refs)} provenance_device={len(provenance_device)} tech_mentions={len(tech_mentions)} principles={len(prin)}')
          PY
          git config user.name lopezcarlton
          git config user.email lopezcarlton@gmail.com
          git add informes/AUTHORITY_BOUNDARY_AUDIT_PRE_IRMA_2026-09-02.md
          git commit -m 'audit knowledge-device authority boundary pre-Irma'
          git push origin HEAD:main
