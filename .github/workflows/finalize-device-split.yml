name: finalize-device-split

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.issue.title == 'Finalize device split'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update physical references and remove source copy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('INICIAR_AQUI_CHAT_NUEVO.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'Para trabajo explícitamente técnico usar `dispositivo/REENTRY_TECNICO.md` mientras la separación física siga pendiente.',
              'Para trabajo explícitamente técnico usar el repositorio separado `lopezcarlton/didxaza-dispositivo`, comenzando por su `REENTRY_TECNICO.md`. La copia activa del dispositivo ya no vive en este repositorio.'
          )
          s = s.replace(
              'Los derivados históricos que aparezcan en `dispositivo/` pueden utilizarse para localizar material, pero no sustituyen estas fuentes.',
              'Los derivados históricos preservados en `lopezcarlton/didxaza-dispositivo` pueden utilizarse para localizar material, pero no sustituyen estas fuentes.'
          )
          s = s.replace(
              '- completar la separación física del dispositivo cuando exista el repositorio técnico destino.',
              '- continuar el desarrollo técnico del dispositivo en `lopezcarlton/didxaza-dispositivo` sin devolver autoridad al repositorio de Voces.'
          )
          p.write_text(s, encoding='utf-8')

          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '`dispositivo/REENTRY_TECNICO.md`',
              '`lopezcarlton/didxaza-dispositivo` → `REENTRY_TECNICO.md`'
          )
          s = s.replace(
              '├── dispositivo/         # sistema derivado temporal, pendiente de separación\n└── .github/',
              '└── .github/             # control técnico de este repositorio'
          )
          s = s.replace(
              'La carpeta `dispositivo/` conserva temporalmente el estado de herramientas lingüísticas experimentales que consumen conocimiento del proyecto. **No constituye una segunda fuente de verdad y no tiene autoridad para escribir, adoptar o promover conocimiento.** La regla vigente se documenta en `conocimiento/decisiones/DEC-AUTORIDAD-SISTEMA-CONOCIMIENTO.md`.',
              'El dispositivo técnico vive físicamente en `lopezcarlton/didxaza-dispositivo`. **No constituye una segunda fuente de verdad y no tiene autoridad para escribir, adoptar o promover conocimiento.** La regla vigente se documenta en `conocimiento/decisiones/DEC-AUTORIDAD-SISTEMA-CONOCIMIENTO.md`.'
          )
          s = s.replace(
              'Durante agosto avanzó en paralelo una capa experimental para análisis, revisión, explicación y producción controlada. Se conserva bajo `dispositivo/` por genealogía y reproducibilidad técnica, pero su autoridad está subordinada al Sistema de Conocimiento. Los descubrimientos que surjan durante su desarrollo deben volver a las fuentes originales y al procedimiento de actualización antes de modificar teoría, pedagogía, metodología o corpus.',
              'Durante agosto avanzó en paralelo una capa experimental para análisis, revisión, explicación y producción controlada. Desde el 3 de septiembre de 2026 se conserva en el repositorio técnico separado `lopezcarlton/didxaza-dispositivo`; su autoridad permanece subordinada al Sistema de Conocimiento. Los descubrimientos que surjan durante su desarrollo deben volver a las fuentes originales y al procedimiento de actualización antes de modificar teoría, pedagogía, metodología o corpus.'
          )
          p.write_text(s, encoding='utf-8')

          p = Path('00_ARQUITECTURA_DEL_CONOCIMIENTO.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '├── dispositivo/         # sistema derivado temporal; pendiente de separación física\n└── .github/             # control técnico del repositorio',
              '└── .github/             # control técnico del repositorio'
          )
          s = s.replace(
              '- `dispositivo/` es un sistema derivado y no forma parte del Sistema de Conocimiento. Su presencia actual es transitoria hasta completar la separación física verificada.',
              '- El dispositivo es un sistema derivado y no forma parte del Sistema de Conocimiento. Desde 2026-09-03 vive físicamente en `lopezcarlton/didxaza-dispositivo`; este repositorio conserva únicamente la autoridad de conocimiento y el índice histórico de recuperación pertinente.'
          )
          s = s.replace(
              '- Se clasifican `informes/`, `archivo/` y `dispositivo/` por función y autoridad.',
              '- Se clasifican `informes/`, `archivo/` y los sistemas derivados por función y autoridad; la separación física del dispositivo quedó ejecutada el 2026-09-03.'
          )
          p.write_text(s, encoding='utf-8')

          p = Path('.github/CODEOWNERS')
          s = p.read_text(encoding='utf-8')
          s = s.replace('\n# Technical layer may be developed separately but does not own canonical knowledge\n/dispositivo/ @lopezcarlton\n', '\n# The technical device is maintained in lopezcarlton/didxaza-dispositivo.\n')
          p.write_text(s, encoding='utf-8')
          PY

          git rm -r dispositivo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add INICIAR_AQUI_CHAT_NUEVO.md README.md 00_ARQUITECTURA_DEL_CONOCIMIENTO.md .github/CODEOWNERS
          git commit -m 'Complete physical separation of didxaza device'
          git push origin HEAD:main
