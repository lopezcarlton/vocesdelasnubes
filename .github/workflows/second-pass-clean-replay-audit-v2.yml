name: second-pass-clean-replay-audit-v2

on:
  push:
    paths:
      - '.github/workflows/second-pass-clean-replay-audit-v2.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Clean replay, recursive closure, semantic hashes, tests, reentry paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast, hashlib, json, os, platform, re, shutil, subprocess, sys

          repo=Path(os.environ['GITHUB_WORKSPACE'])
          src=repo/'dispositivo/runtime/v0_2_15_3'
          work=Path(os.environ['RUNNER_TEMP'])/'second_pass_replay_v0_2_15_3'
          if work.exists(): shutil.rmtree(work)
          shutil.copytree(src,work)
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          expected=json.loads((src/'RELEASE_FILE_MANIFEST_v0_2_15_3.json').read_text(encoding='utf-8'))['sha256']

          paths=['README.md','00_ARQUITECTURA_DEL_CONOCIMIENTO.md','01_JERARQUIA_DE_VERDAD.md','02_BACKLOG.md','03_REGLAS_DE_ACTUALIZACIÓN.md','conocimiento/PEDAGOGIA.md','conocimiento/METODOLOGIA.md','conocimiento/CORPUS.md','conocimiento/VALIDACION.md','conocimiento/principios/PRIN-INVESTIGACION-ABIERTA.md','dispositivo/README.md','dispositivo/migracion/MIGRATION_AGENT_PROTOCOL_v1.md','dispositivo/migracion/MIGRATION_MANIFEST_v1.md','dispositivo/migracion/CURRENT_EXECUTABLE_STATE_v1.md','dispositivo/migracion/REENTRY_CHECKPOINT_2026-09-02.md','dispositivo/migracion/fuentes/CURRENT_STATE_NC001_v37_1_POST_BIB065_REPAIR.md','dispositivo/migracion/fuentes/BH2019_READING_STATE_CLOSED_v0_36_1.md','dispositivo/migracion/fuentes/BH2019_SOURCE_PROVENANCE_v0_36_1.json','dispositivo/migracion/fuentes/BIB065_BUENO_HOLLE_INGESTION_MATRIX_v0_36_1.md','dispositivo/migracion/fuentes/BIB065_BUENO_HOLLE_INGESTION_MATRIX_v0_36_1.csv','dispositivo/pedagogia/PEDAGOGICAL_DISCUSSION_FREEZE_POST_BIB065_v0_36_2.md','dispositivo/hardening/ANALYSIS_CAPABILITY_GUARDRAILS_v0_35.md','dispositivo/development_corpus/DevelopmentCorpusProtocol_v0_35.md']
          missing_paths=[p for p in paths if not (repo/p).exists()]

          mods={p.stem:p for p in src.glob('*.py')}; closure=set()
          def visit(stem):
              if stem in closure or stem not in mods:return
              closure.add(stem)
              tree=ast.parse(mods[stem].read_text(encoding='utf-8-sig'))
              for n in ast.walk(tree):
                  names=[]
                  if isinstance(n,ast.Import): names=[a.name.split('.')[0] for a in n.names]
                  elif isinstance(n,ast.ImportFrom) and n.module:names=[n.module.split('.')[0]]
                  for name in names:
                      if name in mods:visit(name)
          visit('run_cor001_replay_v0_2_15_3')
          closure_files=sorted(mods[x].name for x in closure)
          bad_closure={n:{'actual':sha(src/n),'expected':expected.get(n)} for n in closure_files if sha(src/n)!=expected.get(n)}

          data=['COR001_REPLAY_INPUT_v0_2_15_2.csv','DICTIONARIA_entries_v0_2_15_2.csv','DICTIONARIA_senses_v0_2_15_2.csv','DICTIONARIA_examples_v0_2_15_2.csv','DOCUMENTARY_ALIGNMENT_REGISTRY_v0_2_15_2.csv','PICKETT_LEXICON_BACKFILL_v0_1.csv','PERSON_POSSESSION_EXACT_REGISTRY_v0_2_15_2.csv','BASE_CORRECTOR_DIDXAZA_EVIDENCE_INTEGRITY_v2_19.sqlite']
          bad_data={n:{'actual':sha(src/n) if (src/n).exists() else None,'expected':expected.get(n)} for n in data if not (src/n).exists() or sha(src/n)!=expected.get(n)}

          replay=subprocess.run([sys.executable,'run_cor001_replay_v0_2_15_3.py'],cwd=work,capture_output=True,text=True)
          (work/'SECOND_PASS_REPLAY_STDOUT.txt').write_text(replay.stdout,encoding='utf-8')
          (work/'SECOND_PASS_REPLAY_STDERR.txt').write_text(replay.stderr,encoding='utf-8')
          sem_expected={'details':'eb68bb9a4a3d21e59fa889c5d214f6a7d108c54df228741a2920bec14f5d3d46','metrics':'336db0939a8712b101766f28ebdd841936d8c539736820510c881cf1dbb47dec','summary':'adf75622ec8062b74826535a39ab50ced989e3390bf5e88ad19738d56bb13fa5'}
          sem_actual={};sem_ok=False;out_ok=False;detail_exact=None
          outputs={}
          if replay.returncode==0:
              rm=json.loads((work/'RUN_MANIFEST_COR001_v0_2_15_3.json').read_text(encoding='utf-8'))
              sem_actual=rm.get('semantic_hashes',{});sem_ok=sem_actual==sem_expected
              for n in ['COR001_REPLAY_SUMMARY_v0_2_15_3.csv','COR001_REPLAY_METRICS_v0_2_15_3.json']:
                  outputs[n]={'actual':sha(work/n),'expected':expected[n],'match':sha(work/n)==expected[n]}
              out_ok=all(v['match'] for v in outputs.values())
              detail_exact=sha(work/'COR001_REPLAY_DETAILED_v0_2_15_3.jsonl')==expected['COR001_REPLAY_DETAILED_v0_2_15_3.jsonl']

          tests=subprocess.run([sys.executable,'-m','unittest','discover','-s','.','-p','test*.py','-v'],cwd=work,capture_output=True,text=True)
          (work/'SECOND_PASS_UNITTEST_STDOUT.txt').write_text(tests.stdout,encoding='utf-8')
          (work/'SECOND_PASS_UNITTEST_STDERR.txt').write_text(tests.stderr,encoding='utf-8')
          combined=tests.stdout+'\n'+tests.stderr
          m=re.search(r'Ran\s+(\d+)\s+tests?',combined)
          test_count=int(m.group(1)) if m else None
          tests_ok=tests.returncode==0 and test_count==38 and '\nOK' in combined

          ok=not missing_paths and not bad_closure and not bad_data and replay.returncode==0 and sem_ok and out_ok and tests_ok
          result={'status':'PASS' if ok else 'FAIL','cor001_policy':'ANALYSIS_TARGET_ONLY','checkout_mutated_before_replay':False,'entrypoint_paths_checked':len(paths),'missing_entrypoint_paths':missing_paths,'recursive_import_closure_count':len(closure_files),'recursive_import_closure_files':closure_files,'bad_closure_hashes':bad_closure,'bad_data_hashes':bad_data,'replay_exit_code':replay.returncode,'semantic_hashes_match':sem_ok,'semantic_hashes_expected':sem_expected,'semantic_hashes_actual':sem_actual,'deterministic_outputs_match':out_ok,'deterministic_outputs':outputs,'detailed_byte_exact_match':detail_exact,'detailed_byte_exact_required':False,'unittest_exit_code':tests.returncode,'unittest_count':test_count,'tests_38_pass':tests_ok,'runner_environment':{'python':sys.version,'platform':platform.platform()}}
          (work/'SECOND_PASS_CLEAN_REPLAY_AUDIT_2026-09-02.json').write_text(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True))
          if not ok:sys.exit(1)
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: second-pass-clean-replay-audit-v2-${{ github.sha }}
          path: |
            ${{ runner.temp }}/second_pass_replay_v0_2_15_3/SECOND_PASS_CLEAN_REPLAY_AUDIT_2026-09-02.json
            ${{ runner.temp }}/second_pass_replay_v0_2_15_3/SECOND_PASS_UNITTEST_STDOUT.txt
            ${{ runner.temp }}/second_pass_replay_v0_2_15_3/SECOND_PASS_UNITTEST_STDERR.txt
            ${{ runner.temp }}/second_pass_replay_v0_2_15_3/RUN_MANIFEST_COR001_v0_2_15_3.json
            ${{ runner.temp }}/second_pass_replay_v0_2_15_3/COR001_REPLAY_DETAILED_v0_2_15_3.jsonl
            ${{ runner.temp }}/second_pass_replay_v0_2_15_3/COR001_REPLAY_METRICS_v0_2_15_3.json
            ${{ runner.temp }}/second_pass_replay_v0_2_15_3/COR001_REPLAY_SUMMARY_v0_2_15_3.csv
