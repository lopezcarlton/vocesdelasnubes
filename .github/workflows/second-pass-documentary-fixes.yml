name: second-pass-documentary-fixes

on:
  push:
    paths:
      - '.github/workflows/second-pass-documentary-fixes.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply documentary consistency fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, re

          def replace_once(path, old, new):
              p=Path(path); t=p.read_text(encoding='utf-8')
              n=t.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one exact match, got {n}: {old[:120]!r}')
              p.write_text(t.replace(old,new,1),encoding='utf-8')

          def insert_after_once(path, anchor, addition):
              replace_once(path, anchor, anchor+addition)

          clean=Path('dispositivo/runtime/v0_2_15_3/CLEAN_REPLAY_VERIFICATION_v0_2_15_3.json')
          clean_sha=hashlib.sha256(clean.read_bytes()).hexdigest()
          if clean_sha != '0446768fa8ec1d6e76937688c62e8aa667e7503d211070988944c44253b36644':
              raise SystemExit(f'CLEAN_REPLAY_VERIFICATION exact hash mismatch: {clean_sha}')

          # Root README: distinguish unfinished historical artifact from current COR001 role.
          replace_once('README.md',
              '### COR001\n\n**Abierto, en consolidación.**',
              '### COR001\n\n**Artefacto históricamente abierto; rol operativo actual: `ANALYSIS_TARGET_ONLY`.**')
          insert_after_once('README.md',
              'Permanecen pendientes la revisión ortográfica, correcciones derivadas, algunas regrabaciones, normalización final del audio y productos finales de estudio.',
              '\n\nEstos pendientes describen el estado histórico del corpus y sus productos. **No constituyen una cola activa de resolución caso por caso ni autorizan usar COR001 como benchmark, gold, regresión o fuente de reglas.**')

          # August closure: preserve content but prevent it from masquerading as current reentry state.
          insert_after_once('ESTADO_CIERRE_AGOSTO_2026.md',
              '**Estado:** checkpoint operativo / vista de estado  ',
              '\n**Vigencia actual:** `HISTORICAL_SNAPSHOT / SUPERSEDED_FOR_CURRENT_REENTRY`  \n\nPara el estado vigente de septiembre, usar `INICIAR_AQUI_CHAT_NUEVO.md`, `dispositivo/migracion/CURRENT_EXECUTABLE_STATE_v1.md` y `dispositivo/migracion/REENTRY_CHECKPOINT_2026-09-02.md`. El contenido siguiente se conserva como fotografía del cierre de agosto y no debe reinterpretarse como backlog actual.')

          # Migration protocol: current state/checkpoint are mandatory; Aug-31 device state is historical context only.
          replace_once('dispositivo/migracion/MIGRATION_AGENT_PROTOCOL_v1.md',
              'Antes de migrar, leer:\n\n1. `conocimiento/principios/PRIN-INVESTIGACION-ABIERTA.md`;\n2. `dispositivo/README.md`;\n3. `dispositivo/migracion/MIGRATION_MANIFEST_v1.md`;\n4. `dispositivo/ESTADO_ACTUAL_2026-08-31.md`.',
              'Antes de migrar, leer:\n\n1. `conocimiento/principios/PRIN-INVESTIGACION-ABIERTA.md`;\n2. `dispositivo/README.md`;\n3. `dispositivo/migracion/MIGRATION_MANIFEST_v1.md`;\n4. `dispositivo/migracion/CURRENT_EXECUTABLE_STATE_v1.md`;\n5. `dispositivo/migracion/REENTRY_CHECKPOINT_2026-09-02.md`;\n6. `dispositivo/ESTADO_ACTUAL_2026-08-31.md` únicamente como snapshot histórico previo a la migración.')
          replace_once('dispositivo/migracion/MIGRATION_AGENT_PROTOCOL_v1.md',
              'Consultar los cuatro documentos listados arriba y cualquier archivo específico mencionado por el manifiesto como relacionado con este chat.',
              'Consultar los documentos vigentes listados arriba y cualquier archivo específico mencionado por el manifiesto como relacionado con este chat. `ESTADO_ACTUAL_2026-08-31.md` aporta genealogía histórica, pero no prevalece sobre `CURRENT_EXECUTABLE_STATE_v1.md` ni `REENTRY_CHECKPOINT_2026-09-02.md`.')

          # Current executable state: payload count, correct evidence path, strong second-pass confirmation.
          replace_once('dispositivo/migracion/CURRENT_EXECUTABLE_STATE_v1.md',
              'El manifiesto original enumera 75 payloads. En este checkpoint hay 38 payloads exactos presentes:',
              'El manifiesto original enumera 75 payloads. En este checkpoint hay 39 payloads exactos presentes:')
          replace_once('dispositivo/migracion/CURRENT_EXECUTABLE_STATE_v1.md',
              '- los 38 coinciden con la identidad esperada del release o con la identidad exacta documentada para el artefacto reutilizado;',
              '- los 39 coinciden con la identidad esperada del release o con la identidad exacta documentada para el artefacto reutilizado;')
          replace_once('dispositivo/migracion/CURRENT_EXECUTABLE_STATE_v1.md',
              '- 37 payloads del release todavía no están migrados.',
              '- `CLEAN_REPLAY_VERIFICATION_v0_2_15_3.json` está ahora materializado con identidad exacta del release y conserva los hashes semánticos históricos de referencia;\n- 36 payloads del release todavía no están migrados.')
          replace_once('dispositivo/migracion/CURRENT_EXECUTABLE_STATE_v1.md',
              'Evidencia: `migracion/ISOLATED_REPLAY_VERIFICATION_v0_2_15_3_2026-09-02.md`.',
              'Evidencia: `dispositivo/migracion/ISOLATED_REPLAY_VERIFICATION_v0_2_15_3_2026-09-02.md`.')
          insert_after_once('dispositivo/migracion/CURRENT_EXECUTABLE_STATE_v1.md',
              '`ISOLATED_REPLAY_REPRODUCED / TECHNICAL_REPRODUCIBILITY_PASS / NON_AUTHORITATIVE / COR001_ANALYSIS_TARGET_ONLY`.',
              '\n\nUna segunda pasada ejecutada sobre un checkout sin mutación previa confirmó además: 17/17 módulos en la clausura recursiva de imports con SHA histórico exacto, 8/8 dependencias de datos exactas, hashes semánticos `details/metrics/summary` idénticos al clean replay histórico, `SUMMARY`/`METRICS` byte-idénticos y 38/38 pruebas `unittest` aprobadas. La diferencia byte a byte de `DETAILED` sigue limitada a IDs efímeros.')

          # Manifest: register exact clean verification and update payload counts / stronger replay wording.
          insert_after_once('dispositivo/migracion/MIGRATION_MANIFEST_v1.md',
              '| `dispositivo/runtime/v0_2_15_3/run_cor001_replay_v0_2_15_3.py` | runner exacto del replay histórico; sólo reproducibilidad técnica |',
              '\n| `dispositivo/runtime/v0_2_15_3/CLEAN_REPLAY_VERIFICATION_v0_2_15_3.json` | verificación limpia histórica exacta; SHA-256 `0446768fa8ec1d6e76937688c62e8aa667e7503d211070988944c44253b36644`; referencia de hashes semánticos y 38/38 pruebas |')
          replace_once('dispositivo/migracion/MIGRATION_MANIFEST_v1.md',
              '`RELEASE_FILE_MANIFEST_v0_2_15_3.json` enumera 75 payloads. En este checkpoint hay **38/75 payloads exactos recuperados** y 37 ausentes.',
              '`RELEASE_FILE_MANIFEST_v0_2_15_3.json` enumera 75 payloads. En este checkpoint hay **39/75 payloads exactos recuperados** y 36 ausentes.')
          replace_once('dispositivo/migracion/MIGRATION_MANIFEST_v1.md',
              '- el runtime sigue con 38/75 payloads exactos materializados;',
              '- el runtime sigue con 39/75 payloads exactos materializados;')
          insert_after_once('dispositivo/migracion/MIGRATION_MANIFEST_v1.md',
              'El slice final de semántica de superficie y la cadena histórica de 38 pruebas permanecen reproducibles desde artefactos almacenados. El replay histórico v0.2.15.3 fue regenerado en un checkout aislado de GitHub Actions y obtuvo `TECHNICAL_REPRODUCIBILITY_PASS`: todas las dependencias directas verificadas coincidieron con el release y los outputs deterministas `SUMMARY` y `METRICS` reprodujeron exactamente sus SHA-256 históricos. Ver `ISOLATED_REPLAY_VERIFICATION_v0_2_15_3_2026-09-02.md`. Esto no concede autoridad lingüística a COR001.',
              '\n\nLa segunda pasada fortaleció esa conclusión sobre un checkout sin mutación previa: verificó la clausura recursiva de 17 módulos, 8 dependencias de datos, los tres hashes semánticos históricos, los outputs deterministas y 38/38 pruebas. El primer cierre se conserva como genealogía de la reparación de transporte; la segunda pasada es la comprobación limpia del estado final materializado.')

          # Replay verification: accurately distinguish the first repair run from the final clean second pass.
          replace_once('dispositivo/migracion/ISOLATED_REPLAY_VERIFICATION_v0_2_15_3_2026-09-02.md',
              'Esta verificación reproduce el runner histórico `run_cor001_replay_v0_2_15_3.py` en un checkout limpio de GitHub Actions y compara las dependencias directas y los outputs deterministas contra `RELEASE_FILE_MANIFEST_v0_2_15_3.json`.',
              'Esta verificación documenta dos ejecuciones complementarias del runner histórico `run_cor001_replay_v0_2_15_3.py`. La primera detectó y reparó una normalización de transporte antes del replay; la segunda ejecutó el estado final de `main` desde un checkout sin mutación previa. Se comparan identidades de release, clausura recursiva de imports, hashes semánticos, outputs deterministas y pruebas históricas.')
          replace_once('dispositivo/migracion/ISOLATED_REPLAY_VERIFICATION_v0_2_15_3_2026-09-02.md',
              '## 2. Ejecución de cierre',
              '## 2. Ejecución inicial de reparación y cierre')
          insert_after_once('dispositivo/migracion/ISOLATED_REPLAY_VERIFICATION_v0_2_15_3_2026-09-02.md',
              'DETERMINISTIC_OUTPUTS_OK = true\n```',
              '\n\nEsta ejecución partió de un checkout limpio, pero **reparó el registry de persona/posesión dentro del worktree antes de lanzar el replay** y luego publicó esa reparación. Por ello se conserva como cierre de reparación, no como la demostración más fuerte de un replay inmutable del `main` final.\n\n### 2.1 Segunda pasada limpia sobre el estado final\n\n```text\nworkflow = second-pass-clean-replay-audit-v2\nrun_id = 33682539100\njob_id = 100422262288\nhead_sha = 4edf9dcde8ad86025b319b6e3a78e3fb3a173a9c\nrunner = Ubuntu 24.04 / Python 3.12.3\ncheckout_mutated_before_replay = false\nresult = SUCCESS\n```\n\nLa segunda pasada verificó:\n\n```text\nENTRYPOINT_PATHS = 23/23\nRECURSIVE_IMPORT_CLOSURE = 17/17 exactos\nDATA_DEPENDENCIES = 8/8 exactas\nREPLAY_EXIT_CODE = 0\nSEMANTIC_HASHES_MATCH = true\nDETERMINISTIC_OUTPUTS_MATCH = true\nUNITTEST = 38/38 PASS\n```\n\nEsta segunda ejecución es la evidencia principal de reproducibilidad del estado final materializado.')
          insert_after_once('dispositivo/migracion/ISOLATED_REPLAY_VERIFICATION_v0_2_15_3_2026-09-02.md',
              'summary = adf75622ec8062b74826535a39ab50ced989e3390bf5e88ad19738d56bb13fa5\n```',
              '\n\nEstos tres valores coinciden exactamente con `CLEAN_REPLAY_VERIFICATION_v0_2_15_3.json`, ahora recuperado con identidad byte-exacta del release:\n\n```text\nSHA256 = 0446768fa8ec1d6e76937688c62e8aa667e7503d211070988944c44253b36644\nSEMANTIC_HASHES_MATCH = true\nTESTS = 38/38 PASS\n```')

          # Reentry checkpoint: record the stronger clean confirmation and the 39th exact payload.
          insert_after_once('dispositivo/migracion/REENTRY_CHECKPOINT_2026-09-02.md',
              '- runtime v0.2.15.3: subconjunto exacto materializado; replay histórico aislado reproducido con `TECHNICAL_REPRODUCIBILITY_PASS` y outputs deterministas exactos;',
              '\n- segunda pasada limpia: checkout sin mutación previa, 17/17 módulos recursivos exactos, hashes semánticos completos coincidentes y 38/38 pruebas aprobadas;\n- `CLEAN_REPLAY_VERIFICATION_v0_2_15_3.json` recuperado con identidad exacta como referencia histórica de esos hashes semánticos;')
          PY

          git config user.name 'lopezcarlton'
          git config user.email 'lopezcarlton@gmail.com'
          git add README.md ESTADO_CIERRE_AGOSTO_2026.md \
            dispositivo/migracion/MIGRATION_AGENT_PROTOCOL_v1.md \
            dispositivo/migracion/CURRENT_EXECUTABLE_STATE_v1.md \
            dispositivo/migracion/MIGRATION_MANIFEST_v1.md \
            dispositivo/migracion/ISOLATED_REPLAY_VERIFICATION_v0_2_15_3_2026-09-02.md \
            dispositivo/migracion/REENTRY_CHECKPOINT_2026-09-02.md
          git commit -m 'fix second-pass replay and reentry documentation'
          git push origin HEAD:main
