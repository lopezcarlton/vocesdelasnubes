name: recover-dictionaria-valency-relations

on:
  push:
    branches:
      - "research/dictionaria-valency-relations-*"
    paths:
      - ".github/workflows/recover-dictionaria-valency-relations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Voces
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout pinned Dictionaria source
        shell: bash
        run: |
          set -euo pipefail
          SRC="${RUNNER_TEMP}/didxazageneral"
          git init "$SRC"
          git -C "$SRC" remote add origin https://github.com/dictionaria/didxazageneral.git
          git -C "$SRC" fetch --depth=1 origin 76c22cf30c23d8f4bc5c83c11013a8cb24fe0f85
          git -C "$SRC" checkout --detach FETCH_HEAD
          test "$(git -C "$SRC" rev-parse HEAD)" = "76c22cf30c23d8f4bc5c83c11013a8cb24fe0f85"
          test -f "$SRC/raw/jzd.dictionaria.sqlite"

      - name: Recover source-level valency relations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import os
          import sqlite3
          from collections import Counter, defaultdict
          from pathlib import Path

          commit = "76c22cf30c23d8f4bc5c83c11013a8cb24fe0f85"
          src = Path(os.environ["RUNNER_TEMP"]) / "didxazageneral"
          db_path = src / "raw" / "jzd.dictionaria.sqlite"
          out_dir = Path(os.environ["RUNNER_TEMP"]) / "dictionaria_valency_relations"
          out_dir.mkdir(parents=True, exist_ok=True)

          relation_types = {
              "ACT+X": "MORE_ACTIVE",
              "ACT-X": "LESS_ACTIVE",
              "CAUSX": "CAUSATIVE",
              "VERSX": "VERSIVE",
          }

          con = sqlite3.connect(f"file:{db_path}?mode=ro", uri=True)
          con.row_factory = sqlite3.Row
          try:
              tables = {
                  row[0]
                  for row in con.execute("SELECT name FROM sqlite_master WHERE type='table'")
              }
              required = {"sense", "sense_field", "textvalue", "entry"}
              assert required <= tables, (required - tables)

              text = defaultdict(lambda: defaultdict(list))
              for row in con.execute(
                  "SELECT text_id, language_id, content FROM textvalue ORDER BY text_id, language_id"
              ):
                  text[str(row["text_id"])][str(row["language_id"])].append(row["content"])

              entries = {}
              pdlma_to_entries = defaultdict(list)
              for row in con.execute(
                  "SELECT entry_id, headword_text_id, pos_id FROM entry ORDER BY entry_id"
              ):
                  entry_id = str(row["entry_id"])
                  vals = text[str(row["headword_text_id"])]
                  ap = list(vals.get("jz_ap", ()))
                  pdlma = list(vals.get("jz_pdlma", ()))
                  entries[entry_id] = {
                      "entry_id": entry_id,
                      "pos_id": row["pos_id"],
                      "headword_ap_values": ap,
                      "headword_pdlma_values": pdlma,
                  }
                  for raw in pdlma:
                      # Source-exact string key only. No tone stripping, symbol removal,
                      # casefold, punctuation rewrite or PDLMA→AP conversion.
                      pdlma_to_entries[raw].append(entry_id)

              sense_to_entry = {
                  str(row["sense_id"]): str(row["entry_id"])
                  for row in con.execute("SELECT sense_id, entry_id FROM sense")
              }

              meaning = defaultdict(lambda: {"en": [], "sp": []})
              for row in con.execute(
                  "SELECT sense_id, text_id FROM sense_field WHERE field_id='PUB_DEF'"
              ):
                  vals = text[str(row["text_id"])]
                  meaning[str(row["sense_id"])]["en"].extend(vals.get("en", ()))
                  meaning[str(row["sense_id"])]["sp"].extend(vals.get("sp", ()))

              relation_rows = []
              sql = (
                  "SELECT sense_id, field_id, text_id FROM sense_field "
                  "WHERE field_id IN ('ACT+X','ACT-X','CAUSX','VERSX') "
                  "ORDER BY field_id, sense_id, text_id"
              )
              for row in con.execute(sql):
                  sense_id = str(row["sense_id"])
                  field_id = str(row["field_id"])
                  entry_id = sense_to_entry[sense_id]
                  vals = text[str(row["text_id"])]
                  related_pdlma = list(vals.get("jz_pdlma", ()))
                  exact_matches_by_value = []
                  union_match_ids = []
                  for raw in related_pdlma:
                      ids = list(pdlma_to_entries.get(raw, ()))
                      exact_matches_by_value.append({"pdlma_raw": raw, "entry_ids": ids})
                      for eid in ids:
                          if eid not in union_match_ids:
                              union_match_ids.append(eid)
                  union_matches = [entries[eid] for eid in union_match_ids]
                  source_entry = entries[entry_id]
                  relation_rows.append({
                      "source_commit": commit,
                      "sense_id": sense_id,
                      "entry_id": entry_id,
                      "source_pos_id": source_entry["pos_id"],
                      "source_headword_ap_values": source_entry["headword_ap_values"],
                      "source_headword_pdlma_values": source_entry["headword_pdlma_values"],
                      "source_meaning_en": meaning[sense_id]["en"],
                      "source_meaning_sp": meaning[sense_id]["sp"],
                      "field_id": field_id,
                      "relation_type": relation_types[field_id],
                      "relation_text_id": str(row["text_id"]),
                      "related_pdlma_values_raw": related_pdlma,
                      "related_en_values_raw": list(vals.get("en", ())),
                      "related_sp_values_raw": list(vals.get("sp", ())),
                      "all_text_languages": sorted(vals.keys()),
                      "exact_pdlma_headword_matches_by_value": exact_matches_by_value,
                      "exact_pdlma_entry_match_count_union": len(union_match_ids),
                      "exact_pdlma_entry_ids_union": union_match_ids,
                      "exact_pdlma_entry_headword_ap_values_union": [
                          m["headword_ap_values"] for m in union_matches
                      ],
                      "exact_match_policy": "RAW_PDLMA_STRING_EQUALITY_ONLY",
                      "pdlma_to_ap_assertion": False,
                      "pb2015_group_assignment_assertion": False,
                      "generation_license_assertion": False,
                      "correction_assertion": False,
                  })

              by_type = defaultdict(list)
              for row in relation_rows:
                  by_type[row["relation_type"]].append(row)

              stats = {
                  "source_repository": "dictionaria/didxazageneral",
                  "source_commit": commit,
                  "sqlite_sha256": hashlib.sha256(db_path.read_bytes()).hexdigest(),
                  "relation_field_ids": relation_types,
                  "total_relation_field_rows": len(relation_rows),
                  "by_relation_type": {},
                  "global": {},
                  "methodological_limits": {
                      "relation_field_name_comes_from_source_generator": True,
                      "relation_value_channel": "RAW_SOURCE_TEXTVALUE",
                      "entry_resolution_policy": "RAW_PDLMA_HEADWORD_STRING_EQUALITY_ONLY",
                      "casefold": False,
                      "tone_stripping": False,
                      "diacritic_stripping": False,
                      "symbol_stripping": False,
                      "near_match": False,
                      "pdlma_to_ap": False,
                      "pb2015_group_assignment": False,
                      "generation_license": False,
                      "correction_authority": False,
                  },
              }

              for relation_type, rows in sorted(by_type.items()):
                  exact_counts = Counter(r["exact_pdlma_entry_match_count_union"] for r in rows)
                  stats["by_relation_type"][relation_type] = {
                      "field_rows": len(rows),
                      "distinct_senses": len({r["sense_id"] for r in rows}),
                      "distinct_source_entries": len({r["entry_id"] for r in rows}),
                      "rows_with_pdlma_value": sum(bool(r["related_pdlma_values_raw"]) for r in rows),
                      "rows_with_english_translation": sum(bool(r["related_en_values_raw"]) for r in rows),
                      "rows_with_spanish_translation": sum(bool(r["related_sp_values_raw"]) for r in rows),
                      "rows_with_unique_exact_pdlma_entry_match": exact_counts[1],
                      "rows_with_no_exact_pdlma_entry_match": exact_counts[0],
                      "rows_with_multiple_exact_pdlma_entry_matches": sum(
                          n for k, n in exact_counts.items() if k > 1
                      ),
                      "exact_match_count_distribution": {
                          str(k): v for k, v in sorted(exact_counts.items())
                      },
                  }

              stats["global"] = {
                  "distinct_senses_with_relation": len({r["sense_id"] for r in relation_rows}),
                  "distinct_source_entries_with_relation": len({r["entry_id"] for r in relation_rows}),
                  "rows_with_unique_exact_pdlma_entry_match": sum(
                      r["exact_pdlma_entry_match_count_union"] == 1 for r in relation_rows
                  ),
                  "rows_with_no_exact_pdlma_entry_match": sum(
                      r["exact_pdlma_entry_match_count_union"] == 0 for r in relation_rows
                  ),
                  "rows_with_multiple_exact_pdlma_entry_matches": sum(
                      r["exact_pdlma_entry_match_count_union"] > 1 for r in relation_rows
                  ),
              }

              # Stable samples: first five source rows per relation type.
              samples = {
                  relation_type: rows[:5]
                  for relation_type, rows in sorted(by_type.items())
              }

              (out_dir / "VALENCY_RELATION_STATS.json").write_text(
                  json.dumps(stats, ensure_ascii=False, indent=2, sort_keys=True),
                  encoding="utf-8",
              )
              (out_dir / "VALENCY_RELATION_SAMPLES.json").write_text(
                  json.dumps(samples, ensure_ascii=False, indent=2, sort_keys=True),
                  encoding="utf-8",
              )
              with (out_dir / "VALENCY_RELATIONS.jsonl").open("w", encoding="utf-8") as f:
                  for row in relation_rows:
                      f.write(json.dumps(row, ensure_ascii=False, sort_keys=True) + "\n")

              csv_fields = [
                  "sense_id", "entry_id", "source_pos_id", "source_headword_ap",
                  "source_headword_pdlma", "source_meaning_en", "source_meaning_sp",
                  "field_id", "relation_type", "relation_text_id", "related_pdlma_raw",
                  "related_en_raw", "related_sp_raw", "exact_pdlma_entry_match_count_union",
                  "exact_pdlma_entry_ids_union",
              ]
              with (out_dir / "VALENCY_RELATIONS.csv").open(
                  "w", encoding="utf-8", newline=""
              ) as f:
                  writer = csv.DictWriter(f, fieldnames=csv_fields)
                  writer.writeheader()
                  for r in relation_rows:
                      writer.writerow({
                          "sense_id": r["sense_id"],
                          "entry_id": r["entry_id"],
                          "source_pos_id": r["source_pos_id"],
                          "source_headword_ap": " || ".join(r["source_headword_ap_values"]),
                          "source_headword_pdlma": " || ".join(r["source_headword_pdlma_values"]),
                          "source_meaning_en": " || ".join(r["source_meaning_en"]),
                          "source_meaning_sp": " || ".join(r["source_meaning_sp"]),
                          "field_id": r["field_id"],
                          "relation_type": r["relation_type"],
                          "relation_text_id": r["relation_text_id"],
                          "related_pdlma_raw": " || ".join(r["related_pdlma_values_raw"]),
                          "related_en_raw": " || ".join(r["related_en_values_raw"]),
                          "related_sp_raw": " || ".join(r["related_sp_values_raw"]),
                          "exact_pdlma_entry_match_count_union": r["exact_pdlma_entry_match_count_union"],
                          "exact_pdlma_entry_ids_union": " || ".join(r["exact_pdlma_entry_ids_union"]),
                      })

              print("VALENCY_RELATION_STATS=" + json.dumps(stats, ensure_ascii=False, sort_keys=True))
              print("VALENCY_RELATION_SAMPLES=" + json.dumps(samples, ensure_ascii=False, sort_keys=True))
          finally:
              con.close()
          PY

      - name: Upload recovery evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dictionaria-valency-relations-76c22cf
          path: ${{ runner.temp }}/dictionaria_valency_relations/
